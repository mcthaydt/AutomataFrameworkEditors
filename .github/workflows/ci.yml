# `plan` says how much this run tests; `check` runs the static checks and the Node tests; `browsers` runs the browser
# tests and the journeys, each browser split in six shards that run side by side (18 jobs in a full run); `engines` names
# each browser's result, one check per browser. Every action is pinned to a commit. Nothing is deployed from here (Cloudflare builds the site
# from this repo itself) and nothing is published.
#
# How much is tested (the Owner, 2026-11-15): while a pull request is a draft, a thread is still working on it, so only
# what its change reaches runs, and a run stops at its first failure. The whole suite runs once the pull request is
# ready for review, on every push to main, and on a draft that carries the `full-tests` label. A draft also runs in
# Chromium only (the Owner, 2026-11-16): WebKit and Firefox run in the full run that gates merge.
name: ci

on:
  pull_request:
    # `ready_for_review` starts the whole suite as a draft is handed over; `labeled` lets a thread ask for it sooner.
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  push:
    branches: [main]

permissions:
  contents: read

# A newer push stops the run it replaces, so no one waits on results that no longer count.
concurrency:
  group: ci-${{ github.ref }}${{ github.event_name == 'push' && format('-{0}', github.sha) || '' }}
  # Runs on main are never cancelled, so every merge gets its own result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # How much this run tests, from the event and the files the pull request changes. Everything but `docs` is `true`
  # except on a draft without the `full-tests` label whose change leaves the build and the test setup alone:
  #   full      false: the browser tests the change reaches (Vitest's `--changed`), stopping at the first failure
  #   engines   the browsers the shards run in: Chromium only on a draft, all three otherwise
  #   journeys  false when nothing the built page is made of changed; otherwise a draft plays them in Chromium only
  #   pictures  false when nothing that is seen changed (a `.svelte` or `.css` file, the words, the page, the mockups),
  #             so the screens journey is left out and no pictures are kept; the `screenshots` label (or the older
  #             `pictures`) asks for them
  #   scenes    which scenes of the screens journey take their picture: on a draft, only those of the screens the
  #             change reaches (`scripts/screens-touched.ts`); every scene on a full run
  #   docs      true when only Markdown that people read changed: `docs` passes every check main requires,
  #             under its own name, and every job that tests is left out
  #   quick     `quick ` on a draft, `skipped ` on a docs-only run, and empty otherwise: the start of every
  #             check's name, so a quick run never has the name of a check main may require, and only a full run (or
  #             `docs`) can let a pull request merge
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      full: ${{ steps.plan.outputs.full }}
      engines: ${{ steps.plan.outputs.engines }}
      scenes: ${{ steps.plan.outputs.scenes }}
      journeys: ${{ steps.plan.outputs.journeys }}
      pictures: ${{ steps.plan.outputs.pictures }}
      docs: ${{ steps.plan.outputs.docs }}
      quick: ${{ steps.plan.outputs.docs == 'true' && 'skipped ' || steps.plan.outputs.full != 'true' && 'quick ' || '' }}
    steps:
      # Only the scripts folder, for the script that says which screens a change reaches.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          DRAFT: ${{ github.event.pull_request.draft }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          full=true journeys=true pictures=true docs=false scenes='.*'
          engines='["chromium","webkit","firefox"]'
          if [ "$EVENT" = pull_request ] && [[ " $LABELS " != *" full-tests "* ]] &&
            changed="$(gh pr diff "$PR" --repo "$GITHUB_REPOSITORY" --name-only)" && [ -n "$changed" ]; then
            printf 'This pull request changes:\n%s\n' "$changed"
            # Only Markdown that people read (CLAUDE.md and the notes under docs/, never the README or a page a test
            # reads): there is nothing to test, so `docs` passes every check main requires at once, draft or not.
            others="$(grep -vE '^(CLAUDE\.md|docs/.+\.md)$' <<<"$changed" || true)$(grep -E '^docs/((deploy|teams)\.md|mockups/)' <<<"$changed" || true)"
            if [ -z "$others" ]; then
              docs=true
            # A change to how things are installed, built or tested, or to the shared test files, reaches every test.
            elif [ "$DRAFT" = true ] && ! grep -qE '^(tests/fixtures/|package\.json|pnpm-lock\.yaml|\.pnpmfile\.cjs|[^/]*\.config\.(ts|js)|tsconfig[^/]*\.json|\.github/)' <<<"$changed"; then
              full=false engines='["chromium"]'
              grep -qE '^(src/|functions/|index\.html|public/|tests/journeys/)' <<<"$changed" || journeys=false
              grep -qE '(\.svelte|\.css)$|^(src/features/(ui|words)/|index\.html|public/|docs/mockups/|tests/journeys/screens)' <<<"$changed" || pictures=false
              # Only the pictures of the screens the change reaches.
              scenes="$(node scripts/screens-touched.ts <<<"$changed")"
            fi
          fi
          if [[ " $LABELS " == *" screenshots "* || " $LABELS " == *" pictures "* ]]; then pictures=true; fi
          echo "docs=$docs full=$full engines=$engines journeys=$journeys pictures=$pictures scenes=$scenes"
          { echo "docs=$docs"; echo "full=$full"; echo "engines=$engines"; echo "journeys=$journeys"; echo "pictures=$pictures"; echo "scenes=$scenes"; } >> "$GITHUB_OUTPUT"

  # A pull request that changes only Markdown that people read has nothing to test (the Owner, 2026-11-15). This job
  # stands in for every check main requires, under its exact name, and passes at once. Every job that tests is left out
  # and has `skipped ` at the start of its name, so a skipped job never wears a required name, and on any other run this
  # job's own names start with `docs only `.
  docs:
    needs: plan
    if: needs.plan.outputs.docs == 'true'
    name: ${{ needs.plan.outputs.docs == 'true' && matrix.check || format('docs only {0}', matrix.check) }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        check:
          - 'check'
          - 'engines (chromium)'
          - 'engines (webkit)'
          - 'engines (firefox)'
    env:
      CHECK: ${{ matrix.check }}
    steps:
      - run: echo "Only Markdown that people read changed, so there is nothing to test, and $CHECK passes."

  check:
    needs: plan
    if: needs.plan.outputs.docs != 'true'
    name: ${{ needs.plan.outputs.quick }}check
    runs-on: ubuntu-latest
    env:
      # On a draft: the Node tests the change reaches, stopping at the first failure.
      ONLY: ${{ needs.plan.outputs.full != 'true' && '--changed=origin/main --bail=1 --passWithNoTests' || '' }}
    steps:
      # The whole history, so `--changed` can compare with `origin/main`.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm knip
      - run: pnpm build
      - run: pnpm test:node $ONLY

  # Each browser in six shards that run side by side, so a full run is 18 jobs and takes about a third as long as two
  # shards did (the Owner, 2026-11-16). A draft runs Chromium only: the `engines` list comes from `plan`. The screens
  # journey is the longest by far, so its three sizes are shards 1 to 3 (the short browser tests ride with shard 1); every
  # other journey is split three ways, shards 4 to 6.
  browsers:
    needs: plan
    if: needs.plan.outputs.docs != 'true'
    name: browsers (${{ matrix.engine }} ${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    # Playwright's own image, pinned by digest to the Playwright in the lockfile: the three browsers and every system
    # library they need are already in it, so no shard installs them (that install was the slowest part of setting up,
    # 40 s to 12 min). User 1001 is the runner's own user, which Firefox needs. A shard with nothing to do (a draft with
    # no journeys to play) gets no image, so it pulls nothing. Moving to a newer Playwright means a new digest here.
    container:
      image: ${{ (matrix.shard == 1 || (needs.plan.outputs.journeys == 'true' && (matrix.shard > 3 || needs.plan.outputs.pictures == 'true'))) && 'mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27' || '' }}
      options: --user 1001
    # A browser that has gone wrong fails every journey slowly; this stops it, and the journeys give up after fifteen
    # failures (`--bail`), or after one on a draft, so a red run is read in minutes.
    timeout-minutes: 30
    strategy:
      # On a draft the first failure stops the other shards too; the whole suite lets every shard finish.
      fail-fast: ${{ needs.plan.outputs.full != 'true' }}
      matrix:
        engine: ${{ fromJSON(needs.plan.outputs.engines) }}
        shard: [1, 2, 3, 4, 5, 6]
        include:
          - { shard: 1, screens: ipadUpright }
          - { shard: 2, screens: ipadSideways }
          - { shard: 3, screens: phone }
          - { shard: 4, others: 1 }
          - { shard: 5, others: 2 }
          - { shard: 6, others: 3 }
    env:
      BAIL: ${{ needs.plan.outputs.full == 'true' && '15' || '1' }}
      # The screens shards are left out with the pictures; the short browser tests (shard 1) always run.
      JOURNEYS: ${{ needs.plan.outputs.journeys == 'true' && (matrix.shard > 3 || needs.plan.outputs.pictures == 'true') }}
      # A shard with nothing to do (a draft with no journeys to play) does not even install anything.
      WORK: ${{ matrix.shard == 1 || (needs.plan.outputs.journeys == 'true' && (matrix.shard > 3 || needs.plan.outputs.pictures == 'true')) }}
      SCENES: ${{ needs.plan.outputs.scenes }}
    steps:
      # The browser tests run whole, on a draft too: they take seconds, and Vitest's `--changed` fails in browser mode
      # here (its `vite:css-post` step throws on `ui.css` while it works out which tests a change reaches). The journeys
      # drive the built page, which `--changed` could not trace back to its files anyway, so `plan` decides from the
      # paths whether they run, and which screens take their picture.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.WORK == 'true'
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: env.WORK == 'true'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: env.WORK == 'true'
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: env.WORK == 'true'
      - if: matrix.shard == 1
        run: pnpm test:engine ${{ matrix.engine }} --bail=$BAIL
      - if: env.JOURNEYS == 'true'
        run: pnpm build:journeys
      - if: env.JOURNEYS == 'true'
        run: pnpm build:journeys-plain
      # One size of the screens journey (and on a draft, only the scenes the change reaches).
      - if: env.JOURNEYS == 'true' && matrix.screens
        run: pnpm test:journeys tests/journeys/screens.journey.test.ts -t "at ${{ matrix.screens }} ($SCENES)" --bail=$BAIL
        env:
          ENGINE: ${{ matrix.engine }}
      # Every other journey, a third of them in each of the last three shards.
      - if: env.JOURNEYS == 'true' && matrix.others
        run: pnpm test:journeys --exclude=tests/journeys/screens.journey.test.ts --shard=${{ matrix.others }}/3 --bail=$BAIL
        env:
          ENGINE: ${{ matrix.engine }}
      # A red run in a few lines: which journeys failed, and the first line of why.
      - run: node scripts/failed-tests.mjs journeys-result.json
        if: always() && env.JOURNEYS == 'true'
      # Pictures a person looks at (the drunk-grandma check); nothing compares them. A run that left the pictures out
      # keeps none, so the `ci-screens` branch keeps the last full set.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && needs.plan.outputs.pictures == 'true' && env.WORK == 'true'
        with:
          name: screens-${{ matrix.engine }}-${{ matrix.shard }}
          path: tests/**/__screenshots__/**
          if-no-files-found: ignore

  # One check per browser, `engines (<browser>)`, green only when all six of that browser's shards passed, so the names
  # main's protection may ask for stay as they were. A draft has only Chromium's.
  engines:
    needs: [plan, browsers]
    name: ${{ needs.plan.outputs.quick }}engines (${{ matrix.engine }})
    # Also on a run a newer one cancelled, so that run shows red: a skipped check would count as passed.
    if: always() && needs.plan.outputs.docs != 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        engine: ${{ fromJSON(needs.plan.outputs.engines) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
      # The script asks again after a GitHub 5xx and reads each shard from the newest attempt that ran it, so a re-run
      # of one job can pass (see `scripts/engines-gate.ts`).
      - name: Every shard of ${{ matrix.engine }} passed
        run: node scripts/engines-gate.ts
        env:
          GH_TOKEN: ${{ github.token }}
          ENGINE: ${{ matrix.engine }}

  # The editors' mockups (docs/mockups/): static pages of every editor, drawn before the editors are built, so the
  # Owner can review them. One browser takes their pictures at the five sizes; nothing compares them. It runs when the
  # plan says something that is seen changed (the mockups are in that list), or a `pictures` label asks for it.
  mockups:
    needs: plan
    if: needs.plan.outputs.pictures == 'true'
    runs-on: ubuntu-latest
    # The same Playwright image as the browser shards, so Chromium is not installed here either.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --user 1001
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node docs/mockups/shoot.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: screens-mockups
          path: mockup-screens/*.png

  # The same pictures, also as plain files on the `ci-screens` branch, because a cloud session can read the repository
  # through the GitHub API but is refused by the host that serves artifacts. Only the newest pictures are kept (the
  # Owner, 2026-11-15): no folder per commit, and the folders of closed pull requests are taken away. Layout:
  # `main/<engine>/` for the newest push to main and `pr-<number>/<engine>/` for the newest run of each pull request.
  # Only this job may write, only to that branch (branch protection covers `main`), and never for a pull request from a
  # fork.
  screens:
    needs: [plan, engines, mockups]
    if: always() && needs.plan.outputs.docs != 'true' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
      pull-requests: read
    # GitHub keeps only the newest waiting job per group, so a group every run shared let a waiting job on main be
    # dropped. Each push now gets its own group and each pull request one per branch; two writers can then run at once,
    # so the push below starts again from a fresh fetch when the other got there first.
    concurrency:
      group: ci-screens-${{ github.ref }}${{ github.event_name == 'push' && format('-{0}', github.sha) || '' }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      LATEST: ${{ github.event_name == 'push' && 'main' || format('pr-{0}', github.event.pull_request.number) }}
    steps:
      - name: Download this run's pictures
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern 'screens-*' --dir "$RUNNER_TEMP/screens" || true
      - name: Commit them to the ci-screens branch
        run: |
          set -euo pipefail
          shopt -s nullglob
          engines=("$RUNNER_TEMP"/screens/screens-*)
          if [ ${#engines[@]} -eq 0 ]; then echo "This run made no pictures."; exit 0; fi
          write_pictures() {
            rm -rf "$RUNNER_TEMP/branch" && git init -q "$RUNNER_TEMP/branch" && cd "$RUNNER_TEMP/branch"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            # The branch has no history in common with main; the first run starts it.
            if git fetch -q --depth 1 origin ci-screens; then git checkout -q -B ci-screens FETCH_HEAD; else git checkout -q --orphan ci-screens; fi
            # Runs on main can now overlap: an older one finishing last must not put its pictures over a newer merge's.
            if [ "$LATEST" = main ]; then
              head="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
              if [ "$head" != "$GITHUB_SHA" ]; then echo "A newer merge will write main/."; return 0; fi
            fi
            # Keep only `main`, `live` and the folders of open pull requests (`pr-<n>` and `pr-<n>-real`); everything else
            # (closed pull requests, and the per-commit folders earlier runs kept) goes.
            open_prs=" $(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 200 --json number --jq '.[].number' | tr '\n' ' ') "
            for old in */; do
              old="${old%/}"
              case "$old" in
                main | live | "$LATEST") ;;
                pr-*) number="${old#pr-}"; [[ "$open_prs" == *" ${number%-real} "* ]] || rm -rf "$old" ;;
                *) rm -rf "$old" ;;
              esac
            done
            # Each browser's pictures come in one folder per shard (`screens-<engine>-<shard>`); they go into one folder
            # per browser, emptied first so a picture no longer taken does not stay.
            for dir in "${engines[@]}"; do
              engine="${dir##*/screens-}"
              rm -rf "${LATEST:?}/${engine%-[0-9]}"
            done
            for dir in "${engines[@]}"; do
              engine="${dir##*/screens-}"
              mkdir -p "$LATEST/${engine%-[0-9]}"
              find "$dir" -name '*.png' -exec cp {} "$LATEST/${engine%-[0-9]}/" \;
            done
            git add -A
            if git diff --cached --quiet; then echo "No new pictures."; return 0; fi
            git commit -q -m "screens: $LATEST (${{ github.event.pull_request.head.sha || github.sha }})"
            git push -q origin ci-screens
            echo "Pictures: https://github.com/${GITHUB_REPOSITORY}/tree/ci-screens/$LATEST"
          }
          # Each try runs in its own subshell, so any failing command stops that try (`set -e` does not work inside an
          # `if` or `||`, hence the explicit status).
          for try in 1 2 3; do
            set +e; (set -e; write_pictures); status=$?; set -e
            if [ "$status" -eq 0 ]; then exit 0; fi
            if [ "$try" -lt 3 ]; then
              echo "Try $try failed (most often another run saved its pictures first). Starting again from the newest ci-screens."
              sleep $((try * 5))
            fi
          done
          echo "Could not save the pictures after 3 tries."
          exit 1

  # The one aggregate check main requires beside the names above. `plan` decides which checks apply to this run; this
  # passes only when each of those ran and passed and every other was left out by `plan`, so a job skipped because
  # something before it failed or was cancelled never counts as passed. A draft's is `quick gate`, which main never
  # requires, so only a full run (or a docs-only one) can let a pull request merge. A new job is added to both lists.
  gate:
    needs: [plan, docs, check, browsers, engines, mockups, screens]
    if: always()
    name: ${{ needs.plan.outputs.quick == 'quick ' && 'quick ' || '' }}gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every check that applies ran and passed
        env:
          RESULTS: ${{ toJSON(needs) }}
          GATE: |
            const results = JSON.parse(process.env.RESULTS)
            const applies = JSON.parse(process.env.APPLIES)
            let ok = true
            for (const [job, want] of Object.entries(applies)) {
              const got = results[job]?.result
              const good = want ? got === 'success' : got === 'skipped'
              console.log(`${good ? 'ok ' : 'NO '} ${job}: ${want ? 'applies' : 'not applicable'}, ${got}`)
              ok &&= good
            }
            for (const job of Object.keys(results)) {
              if (!(job in applies)) {
                console.log(`NO  ${job}: the gate does not know this job`)
                ok = false
              }
            }
            process.exit(ok ? 0 : 1)
          APPLIES: >-
            {"plan": true, "docs": ${{ needs.plan.outputs.docs == 'true' }}, "check": ${{ needs.plan.outputs.docs != 'true' }}, "browsers": ${{ needs.plan.outputs.docs != 'true' }}, "engines": ${{ needs.plan.outputs.docs != 'true' }}, "mockups": ${{ needs.plan.outputs.pictures == 'true' }}, "screens": ${{ needs.plan.outputs.docs != 'true' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) }}}
        run: |
          node --input-type=module -e "$GATE"
        shell: bash
