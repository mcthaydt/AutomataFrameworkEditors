<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>World · Levels, painting what it is (mockup)</title>
<link rel="stylesheet" href="mockup.css">
<link rel="stylesheet" href="shell.css">
<style>
  .kind { position: absolute; z-index: 1; background: color-mix(in srgb, var(--k) 55%, transparent); box-shadow: inset 0 0 0 2px var(--k); }
  .kind.new { box-shadow: inset 0 0 0 2px #fff; }
  .brush2 { position: absolute; z-index: 3; width: 3.4%; aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 1px #111314; }
  .tray .ti .pic.swatch { width: 32px; height: 32px; border-radius: 6px; }
</style>
</head>
<body>
<!-- World, Levels, painting what it is (taken from LDtk): picking "Ground" in the list picks Paint and fills the tray
     with what the ground can be, each a colour and a word. You paint what a place is; the level's scene paints the look
     from that shape by itself, with no rules to write. "Show what it is" (in View) tints the level by kind, to check
     where the hero can stand. The things go faint while the ground is picked. On the left edge, Box, Fill and Erase
     are held with the free thumb; press and hold on the level to paint with what is there. -->
<div class="canvas">
  <div class="fit">
    <div class="stage grid">
      <div class="veil" style="left:12.4%;top:72.6%;width:6.3%;height:11.2%"></div>
      <div class="veil" style="left:37.2%;top:73.6%;width:6.8%;height:10.2%"></div>
      <div class="kind" style="left:6.2%;top:83.5%;width:87.6%;height:9.2%;--k:#b07a4f"></div>
      <div class="kind" style="left:56.25%;top:56.6%;width:12.5%;height:3.7%;--k:#6fa8dc"></div>
      <div class="kind new" style="left:68.75%;top:56.6%;width:3.2%;height:3.7%;--k:#6fa8dc"></div>
      <div class="brush2" style="left:72.2%;top:58.4%"></div>
      <span class="tip" style="left:44%;top:40%">Paint a ledge. The look follows by itself.</span>
    </div>
  </div>
</div>
<script>
window.MOCK = {
  editor: 'world', place: 'Level 1', saved: 'Not saved: 1 change', changes: 1, zoom: '100%',
  parts: [['Levels', 'squares-four'], ['Tiles', 'grid-four'], ['Scenes', 'mountains']], part: 0,
  t: 2,
  leftOpen: true,
  holds: [['Box', 'square'], ['Fill', 'paint-bucket'], ['Erase', 'eraser']],
  toolopts: '<span>Brush</span><span class="seg"><button class="on">1 tile</button><button>2</button><button>4</button></span>',
  settings: [
    '<span>Show what it is</span><span class="knob2 on"></span>',
    '<span>Grid</span><span class="seg"><button>Off</button><button class="on">Tiles</button><button>Finer</button></span>',
  ],
  tray: {
    tip: 'Pick what it is, then paint. Press and hold the level to paint with what is there.',
    items: [
      { n: 'Ground', sw: '#b07a4f' },
      { n: 'Ledge', sw: '#6fa8dc', on: true },
      { n: 'Ladder', sw: '#d9b45a' },
      { n: 'Water', sw: '#3f6fc0' },
      { n: 'Danger', sw: '#d9534f' },
    ],
  },
  list: {
    count: 10,
    rows: [
      { head: 'Ground', count: 2, fold: false, on: true },
      { n: 'Ground', sw: '#b07a4f', d: 1 },
      { n: 'Ledge you can jump up through', sw: '#6fa8dc', d: 1 },
      { head: 'Things', count: 3, fold: true, faint: true },
      { head: 'Zones', count: 2, fold: true, faint: true },
      { head: 'Scene', count: 1, fold: true, faint: true },
    ],
  },
  library: { open: false },
  closed: [['Changes', 'clock-counter-clockwise', 1], ['Problems', 'warning']],
}
</script>
<script src="frame.js"></script>
</body>
</html>
