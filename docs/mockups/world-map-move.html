<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>World · Moving a level with buttons (mockup)</title>
<link rel="stylesheet" href="mockup.css">
<link rel="stylesheet" href="shell.css">
</head>
<body>
<!-- Anything that can be dragged can be moved with buttons and keys (the editors rule). "Move" on a picked level opens four big arrows, a tile a tap; the arrow keys do the same on a keyboard. Level 4 is one tile from Level 3, so there is no bar yet. When the next tap would make it touch a level, the pad says so first, in words, since nothing touches until then. Done closes it. -->
<div class="canvas">
  <div class="fit">
    <div class="wmap"></div>
  </div>
</div>
<script src="base.js"></script>
<script>
window.MOCK = { ...BASE.map }
</script>
<script src="frame.js"></script>
<script>
const W = BASE.world()
const l4 = W.levels.find((l) => l.n === 'Level 4')
W.levels.find((l) => l.n === 'Level 2').here = false
l4.x = 61; l4.picked = true
W.pad = { on: 'Level 4', note: 'One more tap to the left and Level 4 touches Level 3: players will then walk straight across. On a keyboard, the arrow keys move it too.' }
W.focus = 'Level 4'
window.MAP = W
</script>
<script src="map.js"></script>
</body>
</html>
