<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>World · Levels, the settings open (mockup)</title>
<link rel="stylesheet" href="mockup.css">
<link rel="stylesheet" href="shell.css">
</head>
<body>
<!-- A picked thing's settings, opened on a phone (the end-to-end actions check, H2). An upright phone: the one-line bar "Crate 1 · settings" is pulled up into a sheet over the lower half, above the toolbar, with a handle, the thing's name and "Done" at its top right; the level is fitted into the room above. A phone held sideways: the tab opens into a panel at the right edge, with the same "Done". On an iPad and a computer the settings are always shown (and can be hidden, see world-levels-hidden), so this page matches the first one there. -->
<div class="canvas">
  <div class="fit">
    <div class="stage grid">
      <div class="ring" style="left:37%;top:73.2%;width:7.2%;height:10.8%"></div>
    </div>
  </div>
</div>
<script src="base.js"></script>
<script>
window.MOCK = {
  ...BASE.levels, values: BASE.crate,
  sheetOpen: true, act: { at: [40.6, 73.2] },
}
</script>
<script src="frame.js"></script>
</body>
</html>
