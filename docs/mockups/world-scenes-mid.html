<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>World · Scenes, mid-project (mockup)</title>
<link rel="stylesheet" href="mockup.css">
<link rel="stylesheet" href="shell.css">
<style>
  .bracket { position: absolute; z-index: 2; border: 2px dashed var(--words); border-top: 0; height: 12px; }
  .device { position: absolute; z-index: 2; border: 2px dashed var(--words); border-radius: 6px; }
  .device > span { position: absolute; right: 4px; top: -22px; font: 600 11px/1.2 var(--label); letter-spacing: .07em; text-transform: uppercase; color: var(--words); background: var(--ground); padding: 2px 5px; border-radius: 2px; }
  .brush { position: absolute; z-index: 3; border-radius: 50%; border: 2px dashed #f37f94; background: rgb(243 127 148 / 0.15); }
  .daybar { position: absolute; z-index: 6; display: flex; align-items: center; gap: 8px; padding: 4px 10px; white-space: nowrap; left: var(--fit-left); bottom: calc(var(--fit-bottom) - 6px); }
  .daybar .rbar { width: 200px; background: linear-gradient(90deg, #35434b, #f37f94 22%, #9fd3f0 40%, #9fd3f0 62%, #f37f94 78%, #35434b); }
  .daybar .rbar i { background: none; border-right: 4px solid var(--words); border-radius: 0; }
  @media (max-width: 1000px), (max-height: 600px) { .daybar .label { display: none; } .device { display: none; } .daybar { left: var(--gap); } }
  @media (max-height: 600px) { .daybar .rbar { width: 100px; } }
</style>
</head>
<body>
<!-- World, Scenes, mid-project: painting flowers with a Pencil. The Pencil hovers and the brush's outline shows at its real
     size, in the flowers' pink, before it touches; pressing harder paints more flowers (How many does the same
     for a Pencil with no pressure); a finger on the scene slides the view, so nothing is painted by accident. The brush's own settings sit just above
     the toolbar, the hero and the crate are faint (they belong to Levels), Paint works as it does in Levels (a tray of what to paint
     with the brush and how many at its end, and Box, Fill and Erase for the free thumb: Fable pass, F26), the Sizes dot is
     tapped open (F19), the frames that show what each screen sees are off (they are a switch in Show), and the day bar shows only with the Light tool, so the day
     can be played through. -->
<div class="canvas">
  <div class="fit">
    <div class="stage grid">
      <div class="veil" style="left:12.4%;top:72.6%;width:6.3%;height:11.2%" title="The hero, faint: it belongs to Levels"></div>
      <div class="veil" style="left:37.2%;top:73.6%;width:6.8%;height:10.2%" title="The crate, faint: it belongs to Levels"></div>
      <div class="brush" style="left:18%;top:68%;width:9%;height:13.8%"></div>
    </div>
  </div>
</div>
<script>
window.MOCK = {
  editor: 'world', what: 'Scene', parts: [['Levels', 'squares-four'], ['Tiles', 'grid-four'], ['Scenes', 'mountains']], part: 2,
  tools: [
    ['Pick', 'cursor', 'V'], ['Hand', 'hand', 'H'], ['Paint', 'paint-brush', 'B', true], ['Add', 'plus', 'A', true],
    ['Scatter', 'dots-nine', 'S'], ['Light', 'sun', 'K'], ['Erase', 'eraser', 'E'], ['Play', 'play', 'P'],
  ],
  place: 'Meadow', saved: 'Not saved: 4 changes', changes: 4, tool: 2, state: 'mid-project',
  with: 'Level 1',
  holds: [['Box', 'square'], ['Fill', 'paint-bucket'], ['Erase', 'eraser']],
  toolopts: '<span>Brush</span><span class="seg"><button>Small</button><button class="on">Middle</button><button>Big</button></span><span>How many</span><span class="seg"><button>Few</button><button class="on">Some</button><button>Lots</button></span>',
  tray: {
    more: 'All kinds',
    items: [
      { n: 'Flowers', i: 'flower', on: true },
      { n: 'Grass', i: 'plant' },
      { n: 'Bushes', i: 'tree' },
      { n: 'Rocks', i: 'hexagon' },
    ],
  },
  settings: [
    '<span>What screens see</span><span class="knob2"></span>',
  ],
  list: { title: 'Front to back', count: 6, search: 'Find something', rows: [
      { head: 'In front', count: 1 },
      { n: 'Falling leaves', k: 'close, moves fast', i: 'leaf' },
      { head: 'The level', count: 3 },
      { n: 'Tree 2', k: 'tree', i: 'tree', on: false },
      { n: 'Flowers', k: 'patch', i: 'flower', on: true },
      { n: 'Ground tiles', k: 'meadow', i: 'grid-four', lock: true },
      { head: 'Behind', count: 2 },
      { n: 'Hills', k: 'far away, moves slowly', i: 'mountains' },
      { n: 'Sky', k: 'stays still', i: 'cloud', lock: true },
    ],
    foot: '<button class="btn small"><span class="ic" data-i="plus"></span>Add scenery</button>',
  },
  library: {
    open: false, filters: ['Everything', 'Patches', 'Trees', 'Rocks', 'Skies'], on: 1,
    items: [
      { n: 'Flowers', note: 'pink', i: 'flower', on: true },
      { n: 'Tall grass', i: 'plant' },
      { n: 'Mushrooms', i: 'leaf' },
      { n: 'Pebbles', i: 'circles-three' },
      { n: 'Ferns', i: 'plant' },
      { n: 'Reeds', note: 'by water', i: 'grains' },
      { n: 'Stones', i: 'hexagon' },
    ],
  },
  closed: [['Changes', 'clock-counter-clockwise', 4], ['Problems', 'warning']],
  values: {
    title: 'Flowers', sub: 'A patch · 5 painted', pic: { i: 'flower' }, tab: 'Flowers',
    groups: [
      { name: 'Painted', open: true, rows: [
        { t: 'slider', l: 'Sizes', f: 'sizes', v: '0.3', w: 'A bit mixed', lo: 'All the same', hi: 'Very mixed', at: 30, ch: 'open' },
        { t: 'btns', b: [['Shuffle them', 'shuffle']] },
      ] },
      { name: 'Colors', open: true, rows: [
        { t: 'pick', l: 'Petals', f: 'colors.petal', v: 'Pink', sw: '#f37f94' },
        { t: 'pick', l: 'Stems', f: 'colors.stem', v: 'Grass', sw: '#88a45b' },
      ] },
      { name: 'Light and shadow', count: 2, rows: [] },
    ],
  },
}
</script>
<script src="frame.js"></script>
</body>
</html>
