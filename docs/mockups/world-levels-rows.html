<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>World · Levels, two sizes of row (mockup)</title>
<link rel="stylesheet" href="mockup.css">
<link rel="stylesheet" href="shell.css">
</head>
<body>
<!-- The same values panel at both sizes (the Owner, 2026-11-15: touch keeps 44-point targets; small rows whenever a
     trackpad, a mouse or a hovering Pencil is in use). The size changes only when a panel opens or the pointer comes
     to rest, never under a finger or in the middle of a drag. -->
<div class="canvas paper"><div class="fit"></div></div>
<script>
const groups = [
  { name: 'Place', open: true, rows: [
    { t: 'num', l: 'From the left', f: 'x', v: '6', u: 'tiles' },
    { t: 'num', l: 'From the top', f: 'y', v: '7', u: 'tiles' },
  ] },
  { name: 'Look', open: true, rows: [
    { t: 'pick', l: 'Looks like', f: 'look', v: 'Crate', img: 'art/crate.png' },
    { t: 'choice', l: 'Drawn', f: 'layer', opts: ['Behind', 'With hero', 'In front'], on: 1 },
  ] },
  { name: 'What it does', open: true, rows: [
    { t: 'slider', l: 'How heavy', f: 'mass', v: '1.0', lo: 'Light as a leaf', hi: 'Heavy as a rock', at: 40 },
    { t: 'sw', l: 'The hero can push it', f: 'pushable', on: true },
    { t: 'sw', l: 'Floats in water', f: 'floats', on: false },
    { t: 'num', l: 'Bounce', f: 'bounce', v: '0.1' },
  ] },
  { name: 'Your own values', count: 2, rows: [] },
]
window.MOCK = {
  editor: 'world', place: 'Level 1', saved: 'Sam, 2 minutes ago', state: 'both row sizes', hand: 'touch',
  parts: [['Levels', 'squares-four'], ['Tiles', 'grid-four'], ['Scenes', 'mountains']], part: 0,
  tools: [
    ['Pick', 'cursor', 'V'], ['Hand', 'hand', 'H'], ['Add', 'plus', 'A', true], ['Link', 'link', 'L'],
    ['Zone', 'selection', 'Z'], ['Measure', 'ruler', 'M'], ['Erase', 'eraser', 'E'], ['Play', 'play', 'P'],
  ],
  tool: 0,
  compare: { title: 'Crate-1', sub: 'Crate · a box to push and stand on', pic: { img: 'art/crate.png' }, groups },
}
</script>
<script src="frame.js"></script>
</body>
</html>
