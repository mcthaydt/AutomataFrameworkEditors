<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Characters · Clips (mockup)</title>
<link rel="stylesheet" href="mockup.css">
<link rel="stylesheet" href="shell.css">
<style>
  .clipstage { display: flex; gap: 6%; align-items: flex-end; justify-content: center; width: 100%; height: 100%; }
  .onion { position: relative; line-height: 0; border-bottom: 2px solid #444; padding: 0 30px; }
  .onion canvas { display: block; image-rendering: pixelated; }
  /* The pose now is at full strength with hard pixels, above the others; the poses before and after are faint tints
     of the same size, a step to each side. */
  .onion .now { position: relative; z-index: 2; display: block; }
  .onion .before { position: absolute; z-index: 1; left: 18px; bottom: 0; opacity: 0.2; filter: brightness(0) invert(0.85); }
  .onion .after { position: absolute; z-index: 1; left: 42px; bottom: 0; opacity: 0.2; filter: brightness(0) invert(0.85); }
  .gamesize { display: flex; flex-direction: column; gap: 6px; align-items: center; }
  .gamesize .mini { width: 180px; aspect-ratio: 888/580; background: url(art/level-1.png) 0 0 / 100% 100%; position: relative; border: 1px solid var(--edge); image-rendering: pixelated; }
  .gamesize .mini span { position: absolute; left: 20%; top: 66%; line-height: 0; }
  .gamesize .mini canvas { height: 18px; width: auto; image-rendering: pixelated; }
  .map { position: relative; width: 100%; height: 100%; }
  .node { position: absolute; display: flex; align-items: center; gap: 8px; padding: 8px 12px; border: 1px solid var(--edge); border-radius: var(--corner); background: var(--raised); font-size: 15px; transform: translate(-50%, -50%); white-space: nowrap; }
  .node.on { border-color: var(--touch); box-shadow: inset 0 0 0 1px var(--touch); }
  .node .ic { color: var(--touch); }
  .map svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .map .when { position: absolute; font-size: 13px; color: var(--quiet); transform: translate(-50%, -50%); background: var(--ground); padding: 0 4px; white-space: nowrap; }
  @media (max-width: 699px) and (min-height: 601px) { .gamesize { display: none; } }
  @media (max-height: 600px) { .gamesize { display: none; } }
</style>
</head>
<body>
<!-- Characters, Clips, first look: a clip is a timeline, like the clips of the tools animators know. A row for each
     part of the body, its keys as diamonds, the playhead at 0.30 seconds, moments that start a sound, the frames
     before and after shown faintly (onion skin), and the clip at the game's own size beside it. Clips have no spec
     yet: this is the mockup's guess. -->
<div class="canvas paper">
  <div class="fit">
    <div class="clipstage">
      <div class="onion"><span class="before" data-pixel="keeper" data-fit="0.7"></span><span class="now" data-pixel="step" data-fit="0.7"></span><span class="after" data-pixel="keeper" data-fit="0.7"></span></div>
      <div class="gamesize"><div class="mini"><span data-pixel="step" data-scale="1"></span></div><span class="label">At the game's size</span></div>
    </div>
  </div>
</div>
<script>
window.MOCK = {
  editor: 'characters', parts: [['Figures', 'person'], ['Clips', 'film-strip'], ['How it works', 'flow-arrow']], part: 1,
  tools: [
    ['Pick', 'cursor', 'V'], ['Hand', 'hand', 'H'], ['Pose', 'person-arms-spread', 'O'], ['Add a key', 'diamond', 'K'],
    ['Onion skin', 'stack', 'N'], ['Erase', 'eraser', 'E'], ['Play', 'play', 'P'],
  ],
  status: { pointer: false, grid: 'Frame 3 of 8', snap: false },
  place: 'Keeper', what: 'Figure', saved: 'Mia, 1 hour ago', tool: 2, zoom: '1400%',
  settings: [
    '<span>Show the poses before and after</span><span class="seg"><button>None</button><button class="on">One</button><button>Two</button></span>',
    '<span>Between poses</span><span class="seg"><button>Steady</button><button class="on">Smooth</button><button>Snappy</button></span>',
  ],
  list: { title: 'Clips', count: 7, search: 'Find a clip', rows: [
      { head: 'Keeper', count: 7 },
      { n: 'Stand', k: 'again and again', i: 'person' },
      { n: 'Run', k: '0.8 s', i: 'person-simple-run', on: true },
      { n: 'Jump', k: 'once', i: 'arrow-fat-up' },
      { n: 'Fall', k: 'again and again', i: 'arrow-down' },
      { n: 'Push', k: '1.0 s', i: 'hand' },
      { n: 'Turn', k: 'once', i: 'arrows-clockwise' },
      { n: 'Climb', k: 'not made yet', i: 'ladder', warn: true },
    ],
    foot: '<button class="btn small"><span class="ic" data-i="plus"></span>New clip</button>',
  },  bottom: {
    title: 'Run', icon: 'film-strip',
    head: '<span class="bhead"><span class="lg">◆ a pose</span></span>',
    tl: { unit: 'seconds', ruler: ['0', '0.2', '0.4', '0.6', '0.8'], cols: 8, at: 0.375, rows: [
      { n: 'Whole body', i: 'person', keys: [0, 25, 50, 75, 100] },
      { n: 'Head', i: 'circle', d: 1, keys: [0, 50, 100] },
      { n: 'Left arm', i: 'hand', d: 1, keys: [0, 37.5, 75, 100], onKey: 1, on: true },
      { n: 'Right arm', i: 'hand', d: 1, keys: [0, 37.5, 75, 100] },
      { n: 'Left leg', i: 'sneaker', d: 1, keys: [0, 25, 50, 75, 100] },
      { n: 'Right leg', i: 'sneaker', d: 1, keys: [0, 25, 50, 75, 100] },
      { n: 'Moments', i: 'flag-pennant', evts: [[25, 'Step sound'], [75, 'Step sound']] },
    ] },
  },
  library: { open: false },
  closed: [['Changes', 'clock-counter-clockwise'], ['Problems', 'warning', 1]],
  values: {
    title: 'Run', sub: 'Keeper · a clip', pic: { i: 'person-simple-run' }, tab: 'Run',
    groups: [
      { name: 'Plays', open: true, rows: [
        { t: 'read', l: 'How long', v: 'Under a second' },
        { t: 'choice', l: 'Plays', f: 'loop', opts: ['Once', 'Again and again'], on: 1 },
        { t: 'slider', l: 'Plays faster when the hero runs faster', f: 'speedFollows', v: '0.6', lo: 'Never', hi: 'Fully', at: 60 },
      ] },
      { name: 'The picked pose', open: true, rows: [
        { t: 'read', l: 'When', v: 'A third of the way in' },
        { t: 'slider', l: 'Left arm raised', f: 'keys[1].arm.l', v: '−24', lo: 'Down', hi: 'Up', at: 40 },
        { t: 'choice', l: 'Into the next pose', f: 'keys[1].ease', opts: ['Steady', 'Smooth', 'Snappy'], on: 1 },
      ] },
      { name: 'Moments', count: 2, rows: [] },
    ],
  },
}
</script>
<script src="frame.js"></script>
</body>
</html>
