<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>World · Taking a join away (mockup)</title>
<link rel="stylesheet" href="mockup.css">
<link rel="stylesheet" href="shell.css">
<style>
  .door { position: absolute; z-index: 1; left: 86%; top: 63.9%; width: 6.2%; height: 19.4%; background: #587382; border: 3px solid #111314; border-radius: 3px 3px 0 0; }
  .door::after { content: ""; position: absolute; right: 18%; top: 50%; width: 14%; aspect-ratio: 1; border-radius: 50%; background: #ffe58a; }
  .door.target { box-shadow: 0 0 0 3px #eeb480, 0 0 18px 4px rgb(238 180 128 / 0.6); }
  .press { position: absolute; z-index: 1; left: 70.5%; top: 81%; width: 5.4%; height: 2.6%; background: #c4566c; border: 2px solid #111314; border-radius: 3px 3px 0 0; }
  .kp { position: absolute; z-index: 1; width: 5.4%; }
  .kp canvas { width: 100%; height: auto; image-rendering: pixelated; }
  .reach { position: absolute; z-index: 1; aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%; border: 2px dashed rgb(255 255 255 / 0.45); }
  .wp { position: absolute; z-index: 2; width: 12px; height: 12px; transform: translate(-50%, -50%); border-radius: 50%; background: rgb(255 255 255 / 0.55); border: 2px solid #111314; }
  .lend { position: absolute; z-index: 4; width: 28px; height: 28px; transform: translate(-50%, -50%); border-radius: 50%; background: #eeb480; border: 3px solid #111314; }
  .lend.to { background: #fff; }
  .tag { position: absolute; z-index: 3; transform: translateX(-50%); padding: 2px 8px; border-radius: 4px; background: rgb(30 30 30 / 0.88); color: var(--words); font: 500 12px var(--label); white-space: nowrap; opacity: 0.45; }
  .tag.on { opacity: 1; box-shadow: inset 0 0 0 1px #eeb480; }
  /* A tag is always in front, above its owner's head, with a short line down to it (Fable pass, F28). */
  .tag.up { z-index: 6; opacity: 1; transform: translate(-50%, -100%); }
  .tag.up::after { content: ""; position: absolute; left: 50%; top: 100%; width: 1px; height: 10px; background: rgb(255 255 255 / 0.6); }
  /* The circle and the path each say what they are. */
  .tag.w { z-index: 6; opacity: 0.9; transform: none; background: rgb(30 30 30 / 0.75); color: var(--quiet); }
</style>
</head>
<body>
<!-- Taking a join away (the end-to-end actions check, M16): tap the line between the button and the door and it is picked. The bar over it says "Take away this join", and "Opens" in the settings lists "Nothing" first, so there are two ways to the same thing. Taking it away leaves both the button and the door where they are. -->
<div class="canvas">
  <div class="fit">
    <div class="stage grid">
      <div class="door target"></div>
      <div class="press"></div>
      <span class="kp" data-pixel="keeper" data-scale="1" style="left:30%;top:69%"></span>
      <div class="reach" style="left:33%;top:76%;width:22%"></div>
      <svg class="links" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
        <path d="M22 86 L 50 86" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="0.45" stroke-dasharray="1 1"/>
        <path class="picked" d="M73.2 80 C 76 64, 82 60, 88.4 70" fill="none" stroke="#eeb480" stroke-width="0.7"/>
      </svg>
      <i class="wp" style="left:22%;top:86%"></i><i class="wp" style="left:50%;top:86%"></i>
      <i class="lend" style="left:73.2%;top:80%"></i><i class="lend to" style="left:88.4%;top:70%"></i>
      <div class="ring" style="left:70%;top:79.8%;width:6.4%;height:4.2%"></div>
      <span class="tag on" style="left:73.2%;top:88%">Opens Door 1 for 5 seconds</span>
      <span class="tag up" style="left:32.7%;top:66%">Takes 3 hits</span>
      <span class="tag w" style="left:44.5%;top:62%">Sees this far</span>
      <span class="tag w" style="left:24%;top:87.6%">Walks here</span>
      
    </div>
  </div>
</div>

<script>
window.MOCK = {
  editor: 'world', place: 'Level 2', saved: 'Not saved: 2 changes', changes: 2, zoom: '100%',
  parts: [['Levels', 'squares-four'], ['Tiles', 'grid-four'], ['Scenes', 'mountains']], part: 0,
  t: 3, act: { join: true, at: [79, 60], w: 18, h: 9 },
  // Join's tray: what to draw (the Owner, 2026-11-15: "Draw path" is now Join, F27). One hint: the bubble (F10).
  tray: { more: false, items: [{ n: 'Join two things', i: 'link', on: true }, { n: 'A path to walk', i: 'path' }] },
  list: {
    count: 9,
    rows: [
      { head: 'Things', count: 6, fold: false },
      { n: 'Hero', k: 'hero', img: 'art/hero.png', lock: true, d: 1 },
      { n: 'Crate 1', k: 'crate', img: 'art/crate.png', d: 1 },
      { n: 'Keeper', k: 'keeper', px: 'keeper', d: 1 },
      { n: 'Button 1', k: 'button', i: 'radio-button', on: true, d: 1 },
      { n: 'Door 1', k: 'door', i: 'door', d: 1 },
      { n: 'Goal', k: 'flag', i: 'flag-pennant', d: 1 },
      { head: 'Zones', count: 2, fold: true },
      { head: 'Ground', count: 2, fold: true },
    ],
  },
  library: { open: false },
  closed: [['Changes', 'clock-counter-clockwise', 2], ['Problems', 'warning']],
  values: {
    title: 'Button 1', sub: 'Button · opens something while it is pressed', pic: { i: 'radio-button' }, tab: 'Button 1',
    groups: [
      { name: 'What it does', open: true, rows: [
        { t: 'pick', l: 'Opens', f: 'opens', v: 'Door 1', i: 'door', ch: true },
        { t: 'html', h: '<div class="dropopen"><button>Nothing</button><button class="on">Door 1<span class="ic" data-i="check"></span></button><button>Door 2</button></div>' },
        { t: 'slider', l: 'Stays open for', f: 'stayOpen', v: '5 seconds', lo: 'Only while pressed', hi: 'For good', at: 30, ch: true },
        { t: 'choice', l: 'Pressed by', f: 'pressedBy', opts: ['The hero', 'A crate', 'Either'], on: 2 },
      ] },
      { name: 'Place', open: true, rows: [
        { t: 'num', l: 'From the left', f: 'x', v: '11', u: 'tiles' },
        { t: 'num', l: 'From the top', f: 'y', v: '8', u: 'tiles' },
      ] },
    ],
  },
}
</script>
<script src="frame.js"></script>
</body>
</html>
