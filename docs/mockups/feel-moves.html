<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feel · Moves (mockup)</title>
<link rel="stylesheet" href="mockup.css">
<style>
  .arcs { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 2; overflow: visible; }
  .arcs path, .arcs line { fill: none; vector-effect: non-scaling-stroke; }
  .halo { stroke: var(--ground); stroke-width: 5; }
  .dash { stroke: var(--words); stroke-width: 2.5; stroke-dasharray: 7 5; }
  .old { stroke: var(--words); stroke-width: 2; stroke-dasharray: 3 6; opacity: 0.45; }
  .movetabs { display: flex; gap: 2px; padding: 3px; border: 1px solid var(--edge); border-radius: 3px; }
  .movetabs button { flex: 1; min-height: 44px; border: 0; border-radius: 3px; background: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; font-size: 16px; }
  .movetabs button.on { background: var(--touch); color: var(--ground); }
  .playing { position: absolute; z-index: 4; left: 50%; top: 3%; transform: translateX(-50%); }
</style>
</head>
<body>
<!-- Feel, Moves: the Tuner (spec: Editors PR 30). The game plays in the level's place; moving a slider changes the
     hero at once, and the jump is drawn on the level as a note that redraws as the number moves. -->
<div class="canvas">
  <div class="fit">
    <div class="stage">
      <svg class="arcs" viewBox="0 0 888 580" preserveAspectRatio="none" aria-hidden="true">
        <path class="old" d="M138 484 Q255 200 372 484"/>
        <path class="halo" d="M138 484 Q277 152 415 484"/><path class="dash" d="M138 484 Q277 152 415 484"/>
        <path class="halo" d="M277 318 Q372 120 468 300"/><path class="dash" d="M277 318 Q372 120 468 300"/>
        <line class="halo" x1="277" y1="484" x2="277" y2="318"/><line class="dash" x1="277" y1="484" x2="277" y2="318" style="stroke-dasharray:none"/>
        <line class="halo" x1="138" y1="520" x2="415" y2="520"/><line class="dash" x1="138" y1="520" x2="415" y2="520" style="stroke-dasharray:none"/>
      </svg>
      <span class="chip" style="left:32.5%;top:62%">Reaches <span class="v">3 tiles</span> up</span>
      <span class="chip" style="left:20%;top:91.5%"><span class="v">5 tiles</span> across</span>
      <span class="chip" style="left:44%;top:24%">With an air jump <span class="v">+2.5</span></span>
      <span class="chip playing"><span class="dot"></span>Playing · your changes are live</span>
    </div>
  </div>
</div>
<div class="panels">
  <section class="float panel">
    <header class="panel-head">
      <span class="label">Moves</span>
      <button class="iconbtn" aria-label="Close"><span class="ic" data-i="x"></span></button>
    </header>
    <div class="panel-body">
      <div class="movetabs">
        <button><span class="ic" data-i="person-simple-walk"></span>Walk</button>
        <button class="on"><span class="ic" data-i="arrow-fat-up"></span>Jump</button>
        <button><span class="ic" data-i="arrows-vertical"></span>Air jump</button>
      </div>
      <div class="slider"><span>How high it jumps</span><span class="val">12 · 3 tiles</span>
        <div class="track"><button class="square"><span class="ic" data-i="minus"></span></button><div class="rail"><i style="--at:52%"></i></div><button class="square"><span class="ic" data-i="plus"></span></button></div></div>
      <div class="slider"><span>Let go early to jump lower</span><span class="val">Keeps half</span>
        <div class="track"><button class="square"><span class="ic" data-i="minus"></span></button><div class="rail"><i style="--at:50%"></i></div><button class="square"><span class="ic" data-i="plus"></span></button></div></div>
      <div class="slider"><span>Jump just after leaving a ledge</span><span class="val">0.10 s</span>
        <div class="track"><button class="square"><span class="ic" data-i="minus"></span></button><div class="rail"><i style="--at:30%"></i></div><button class="square"><span class="ic" data-i="plus"></span></button></div></div>
      <div class="rule"></div>
      <p class="quiet">Wall jump and dash are off.</p>
      <button class="btn small"><span class="ic" data-i="person"></span>Turn on in Characters</button>
    </div>
  </section>
</div>
<script>
window.MOCK = {
  editor: 'feel', place: 'Level 1', saved: 'Sam, 2 minutes ago',
  tools: [['Moves', 'person-simple-run'], ['Controls', 'game-controller'], ['Effects', 'sparkle', true], ['Stop', 'stop']], tool: 0,
}
</script>
<script src="frame.js"></script>
</body>
</html>
