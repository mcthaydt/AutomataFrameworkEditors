<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>World · A level held on the map (mockup)</title>
<link rel="stylesheet" href="mockup.css">
<link rel="stylesheet" href="shell.css">
</head>
<body>
<!-- Press and hold a level, or its "...", and a menu opens by it: Go in, Move with buttons, Pull apart (only when it touches another, and it says what that does), Rename, Make a copy, Delete. The same are in the part's menu for the level you are in, so nobody has to know the gesture. Delete says it can be undone. -->
<div class="canvas">
  <div class="fit">
    <div class="wmap"></div>
  </div>
</div>
<section class="pop menup heldp" data-under=".lv2.held" role="menu" aria-label="Level 4"><h6>Level 4</h6><button class="mi"><span class="ic" data-i="arrow-right"></span><span>Go in</span></button><button class="mi"><span class="ic" data-i="arrows-out-cardinal"></span><span>Move<small>A tile at a time, with arrows</small></span></button><button class="mi"><span class="ic" data-i="arrows-out-line-horizontal"></span><span>Pull apart<small>Move it away from Level 3, so players can't walk across</small></span></button><button class="mi"><span class="ic" data-i="pencil-simple"></span><span>Rename</span></button><button class="mi"><span class="ic" data-i="copy"></span><span>Make a copy</span></button><button class="mi"><span class="ic" data-i="trash"></span><span>Delete<small>You can undo it</small></span></button></section>
<script src="base.js"></script>
<script>
window.MOCK = { ...BASE.map }
</script>
<script src="frame.js"></script>
<script>
const W = BASE.world()
const l4 = W.levels.find((l) => l.n === 'Level 4')
W.levels.find((l) => l.n === 'Level 2').here = false
l4.x = 60; l4.held = true
W.edges.push({ a: 'Level 3', b: 'Level 4', at: [6, 10] })
W.focus = 'Level 4'
window.MAP = W
</script>
<script src="map.js"></script>
</body>
</html>
