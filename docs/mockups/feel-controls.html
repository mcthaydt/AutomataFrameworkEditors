<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feel · Controls (mockup)</title>
<link rel="stylesheet" href="mockup.css">
<link rel="stylesheet" href="shell.css">
<style>
  .device2 { position: relative; width: min(100%, 150cqh); aspect-ratio: 19.5 / 9; border: 10px solid #111314; border-radius: 34px; background: url(art/level-1.png) center / cover; image-rendering: pixelated; box-shadow: 0 0 0 2px var(--edge); }
  .tb { position: absolute; display: grid; place-items: center; border-radius: 50%; background: rgb(245 236 194 / 0.28); border: 3px solid rgb(245 236 194 / 0.8); color: #111314; font: 600 13px var(--label); }
  .tb.on { border-color: var(--touch); box-shadow: 0 0 0 4px rgb(238 180 128 / 0.4); }
  .tb .ic { width: 40%; height: 40%; color: #111314; }
  .rh { position: absolute; width: 14px; height: 14px; border-radius: 2px; background: var(--touch); border: 2px solid var(--ground); }
  .thumbzone { position: absolute; bottom: 0; width: 34%; height: 70%; border: 2px dashed rgb(17 19 20 / 0.5); border-bottom: 0; border-radius: 50% 50% 0 0; }
  .thumbzone span { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); font: 600 11px var(--label); letter-spacing: .07em; text-transform: uppercase; color: #111314; white-space: nowrap; }
  .pad { position: relative; width: min(92%, 120cqh); aspect-ratio: 2 / 1.15; }
  .pad svg { width: 100%; height: 100%; }
  .callout { position: absolute; display: flex; align-items: center; gap: 6px; padding: 4px 10px; background: var(--raised); border: 1px solid var(--edge); border-radius: var(--corner); font-size: 14px; white-space: nowrap; }
  .callout.on { border-color: var(--touch); color: var(--touch); }
  @media (max-width: 699px) and (min-height: 601px) { .callout { font-size: 12px; padding: 2px 6px; } }
</style>
</head>
<body>
<!-- Feel, Controls, first look: the touch layout (audit change 9). A phone held sideways, as a player holds it, with
     the game inside and its touch buttons where the thumbs rest. Drag a button, pull its corner to size it; the dashed
     arches are where a thumb reaches without stretching. Gamepad and Keys are the other two ways to look. -->
<div class="canvas">
  <div class="fit" style="display:grid;place-items:center">
    <div class="device2">
      <div class="thumbzone" style="left:0"><span>Left thumb</span></div>
      <div class="thumbzone" style="right:0"><span>Right thumb</span></div>
      <span class="tb" style="left:6%;bottom:10%;width:20%;aspect-ratio:1"><span class="ic" data-i="arrows-left-right"></span></span>
      <span class="tb on" style="right:6%;bottom:12%;width:14%;aspect-ratio:1"><span class="ic" data-i="arrow-fat-up"></span></span>
      <span class="tb" style="right:23%;bottom:6%;width:10%;aspect-ratio:1"><span class="ic" data-i="hand"></span></span><span class="chip" style="right:22%;bottom:-1%;left:auto;top:auto">Pull</span><span class="chip" style="right:5%;bottom:3%;left:auto;top:auto">Jump</span>
      <span class="tb" style="right:4%;top:6%;width:7%;aspect-ratio:1"><span class="ic" data-i="pause"></span></span>
    </div>
  </div>
</div>
<script>
window.MOCK = {
  editor: 'feel', parts: [['Moves', 'person-simple-run'], ['Controls', 'game-controller'], ['Effects', 'sparkle']], part: 1,
  tools: [['Pick', 'cursor', 'V'], ['Hand', 'hand', 'H'], ['Try it', 'hand-tap', 'T'], ['Play', 'play', 'P']],
  status: { pointer: false, grid: false, snap: false },
  place: 'Touch buttons', what: 'Controls', saved: 'Sam, 2 minutes ago', tool: 0, zoom: '100%',
  settings: [
    '<span>Show</span><span class="seg"><button class="on">Touch</button><button>Gamepad</button><button>Keys</button></span>',
    '<span>On</span><span class="seg"><button>Phone upright</button><button class="on">Phone sideways</button><button>Tablet</button></span>',
  ],
  list: { title: 'Actions', count: 5, search: 'Find an action', rows: [
      { head: 'The hero', count: 4 },
      { n: 'Walk', k: 'stick or ← →', i: 'person-simple-walk' },
      { n: 'Jump', k: 'Space', i: 'arrow-fat-up', on: true },
      { n: 'Pull the crate', k: 'Space', i: 'hand', warn: true },
      { n: 'Dash', k: 'off', i: 'lightning', hid: true },
      { head: 'The game', count: 1 },
      { n: 'Pause', k: 'Esc', i: 'pause' },
    ],
  },
  closed: [['Changes', 'clock-counter-clockwise'], ['Problems', 'warning', 1]],
  values: {
    title: 'Jump button', sub: 'Touch · right thumb', pic: { i: 'arrow-fat-up' }, tab: 'Jump button',
    groups: [
      { name: 'Place and size', open: true, rows: [
        { t: 'slider', l: 'Size', f: 'touch.jump.size', v: '64 points', lo: 'Small', hi: 'Big', at: 55 },
        { l: 'Drag it on the phone to move it, or nudge it:' },
        { t: 'btns', b: [['Left', 'arrow-left'], ['Right', 'arrow-right'], ['Up', 'arrow-up'], ['Down', 'arrow-down']] },
      ] },
      { name: 'Look', open: true, rows: [
        { t: 'slider', l: 'How solid', f: 'touch.alpha', v: '70%', lo: 'Faint', hi: 'Solid', at: 70 },
        { t: 'sw', l: 'Players may move it', f: 'touch.movable', on: true },
        { t: 'sw', l: 'Hide until a thumb touches', f: 'touch.hideIdle', on: false },
      ] },
      { name: 'Does', open: true, rows: [
        { t: 'pick', l: 'Action', f: 'touch.jump.action', v: 'Jump', i: 'arrow-fat-up' },
      ] },
    ],
  },
}
</script>
<script src="frame.js"></script>
</body>
</html>
