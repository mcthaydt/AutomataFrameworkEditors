<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sound · Music (mockup)</title>
<link rel="stylesheet" href="mockup.css">
<link rel="stylesheet" href="shell.css">
<style>
  /* Music as loops on lanes, the way GarageBand does it (the Owner, Q3): whole loops laid out with one press; a motif
     is a tune made once and reused. MIDI goes in and out (Q5). */
  .song { width: 100%; height: 100%; display: grid; grid-template-columns: 190px 1fr; grid-auto-rows: minmax(0, 1fr); grid-template-rows: 26px 26px; gap: 6px 8px; padding: 2px 0; position: relative; }
  .bars { display: grid; grid-template-columns: repeat(var(--n), 1fr); border-bottom: 2px solid var(--words); align-items: end; }
  .bars span { font: 12px var(--measure); color: var(--quiet); padding-left: 3px; border-left: 1px solid var(--edge); overflow: hidden; }
  .sparts { display: grid; grid-template-columns: repeat(var(--n), 1fr); gap: 3px; }
  .sparts span { border-radius: 3px; padding: 3px 8px; font: 500 13px var(--label); color: var(--quiet); background: var(--raised); white-space: nowrap; overflow: hidden; }
  .lanehead { display: flex; flex-wrap: wrap; gap: 4px 6px; align-content: center; align-items: center; padding: 2px 6px 2px 8px; border: 1px solid var(--edge); border-radius: 3px; background: var(--raised); min-width: 0; }
  .lanehead > .ic { color: var(--quiet); }
  .lanehead .label { flex: 1; }
  .lanehead .qsr { flex-basis: 100%; display: flex; gap: 4px; }
  .lanehead .label { overflow: hidden; white-space: nowrap; }
  .lanehead .qs { height: 28px; padding: 0 8px; border: 1px solid var(--line); border-radius: 6px; display: inline-flex; gap: 4px; align-items: center; font: 500 12px var(--label); color: var(--quiet); }
  .lanehead .qs .ic { width: 14px; height: 14px; }
  .lanehead .qs.on { background: var(--hover); color: var(--words); border-color: var(--quiet); }
  .lanehead .lv { flex-basis: 100%; height: 4px; border-radius: 2px; background: var(--edge); position: relative; margin: 3px 0 2px; }
  .lanehead .lv i { position: absolute; inset: 0 auto 0 0; background: var(--quiet); border-radius: 2px; }
  .lane { position: relative; display: grid; grid-template-columns: repeat(var(--n), 1fr); gap: 0 3px; background: repeating-linear-gradient(90deg, transparent 0 calc(100% / 4 - 1px), var(--edge) calc(100% / 4 - 1px) calc(100% / 4)); }
  .loop { position: relative; border-radius: 4px; padding: 4px 8px; overflow: hidden; color: var(--words); font: 500 13px/1.2 var(--label); white-space: nowrap; border: 1px solid var(--line); background: var(--raised); }
  .loop.on { background: var(--hover); outline: 2px solid var(--accent); outline-offset: -1px; }
  .loop::after { content: none; }
  .drums { } .drums::after { background: repeating-linear-gradient(90deg, var(--ground) 0 3px, transparent 3px 14px); }
  .bass { } .bass::after { background: repeating-linear-gradient(90deg, var(--ground) 0 18px, transparent 18px 26px); clip-path: polygon(0 60%, 100% 60%, 100% 100%, 0 100%); }
  .chords { } .chords::after { background: repeating-linear-gradient(90deg, var(--ground) 0 40px, transparent 40px 48px); }
  .tune { } .tune::after { background: radial-gradient(circle, var(--ground) 2px, transparent 3px) 0 0 / 12px 9px; }
  .tune.copy { color: var(--quiet); }
  .tune .ic { width: 13px; height: 13px; vertical-align: -2px; }
  .ph { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--words); z-index: 3; box-shadow: 0 0 0 1px var(--ground); }
  .roll { position: absolute; inset: 0; display: grid; grid-template-columns: 64px 1fr; }
  .keys { display: grid; grid-auto-rows: 1fr; border-right: 1px solid var(--edge); }
  .keys span { background: #d6d6d6; border-bottom: 1px solid #555; }
  .keys span.b { background: #2a2a2a; margin-right: 22px; border-radius: 0 3px 3px 0; }
  .grid2 { position: relative; background-image: linear-gradient(90deg, color-mix(in srgb, var(--words) 10%, transparent) 1px, transparent 1px), linear-gradient(color-mix(in srgb, var(--words) 8%, transparent) 1px, transparent 1px); background-size: calc(100% / 16) 100%, 100% calc(100% / 12); }
  .note { position: absolute; height: calc(100% / 12 - 3px); margin-top: 1px; border-radius: 3px; background: var(--quiet); border: 1px solid var(--ground); }
  .note.on { background: var(--words); outline: 2px solid var(--accent); }
  @media (max-width: 1000px), (max-height: 600px) { .song { grid-template-columns: 110px 1fr; } .lanehead .qsr { display: none; } }
  @media (max-width: 699px) and (min-height: 601px), (max-height: 600px) { .song { --n: 8 !important; } .bars span:nth-child(n+9), .sparts span:nth-child(n+3), .lane > .loop.late { display: none; } }
</style>
</head>
<body>
<!-- Sound, Music, first look: the meadow tune as loops on four lanes. Play, stop, loop, the beats a minute and the key are
     in the toolbar; each row has Mute, Only this and how loud it is; the song's parts (calm, danger, won) are
     over the time. The Library along the bottom is where loops come from: press one to hear it,
     drag it to a lane. MIDI goes in and out from the list. -->
<div class="canvas paper">
  <div class="fit">
    <div class="song" style="--n:16">
      <span class="label" style="align-self:center">Parts of the song</span>
      <div class="sparts"><span style="grid-column:1/9">Calm</span><span style="grid-column:9/13">Danger</span><span style="grid-column:13/17">Won</span></div>
      <span></span>
      <div class="bars"><span>0:00</span><span></span><span></span><span></span><span>0:08</span><span></span><span></span><span></span><span>0:16</span><span></span><span></span><span></span><span>0:24</span><span></span><span></span><span></span></div>
      <div class="lanehead"><span class="ic" data-i="music-notes-simple"></span><span class="label">Tune</span><span class="qsr"><span class="qs"><span class="ic" data-i="speaker-slash"></span>Mute</span><span class="qs">Only this</span></span><span class="lv"><i style="width:70%"></i></span></div>
      <div class="lane"><div class="loop tune" style="grid-column:1/5"><span class="ic" data-i="diamond"></span> Keeper's tune</div><div class="loop tune copy late" style="grid-column:9/13"><span class="ic" data-i="diamond"></span> Keeper's tune</div><i class="ph" style="left:25%"></i></div>
      <div class="lanehead"><span class="ic" data-i="piano-keys"></span><span class="label">Chords</span><span class="qsr"><span class="qs"><span class="ic" data-i="speaker-slash"></span>Mute</span><span class="qs">Only this</span></span><span class="lv"><i style="width:55%"></i></span></div>
      <div class="lane"><div class="loop chords on" style="grid-column:1/9">Sunny chords</div><div class="loop chords late" style="grid-column:9/17">Rainy chords</div><i class="ph" style="left:25%"></i></div>
      <div class="lanehead"><span class="ic" data-i="wave-sine"></span><span class="label">Bass</span><span class="qsr"><span class="qs"><span class="ic" data-i="speaker-slash"></span>Mute</span><span class="qs">Only this</span></span><span class="lv"><i style="width:60%"></i></span></div>
      <div class="lane"><div class="loop bass" style="grid-column:3/9">Walking bass</div><div class="loop bass late" style="grid-column:9/15">Walking bass</div><i class="ph" style="left:25%"></i></div>
      <div class="lanehead"><span class="ic" data-i="metronome"></span><span class="label">Drums</span><span class="qsr"><span class="qs on"><span class="ic" data-i="speaker-slash"></span>Mute</span><span class="qs">Only this</span></span><span class="lv"><i style="width:45%"></i></span></div>
      <div class="lane"><div class="loop drums" style="grid-column:1/5">Soft beat</div><div class="loop drums late" style="grid-column:5/17">Bounce beat</div><i class="ph" style="left:25%"></i></div>
    </div>
  </div>
</div>
<script>
window.MOCK = {
  editor: 'sound', parts: [['Sounds', 'speaker-high'], ['Music', 'music-notes']], part: 1,
  tools: [['Pick', 'cursor', 'V'], ['Hand', 'hand', 'H'], ['Add a loop', 'plus', 'A'], ['Cut', 'scissors', 'C'], ['Pencil', 'pencil-simple', 'B'], ['Erase', 'eraser', 'E'], ['Play', 'play', 'P']],
  status: { pointer: '0:08', unit: '', grid: 'Line up with the beat', snap: false },
  place: 'Meadow tune', off: [3], jobs: ['Move: pick and move a loop', 'Place: add a loop', 'Paint: draw notes'], what: 'Music', saved: 'Mia, 20 minutes ago', tool: 0, zoom: '0:32',
  settings: ['<span>Speed</span><span class="num">120</span><span>· walking pace</span>', '<span>Tick along</span><span class="knob2"></span>', '<span class="num">0:08</span>'],
  list: { title: 'The song', count: 9, search: 'Find a loop or tune', rows: [
      { head: 'Rows', count: 4 },
      { n: 'Tune', k: '2 loops', i: 'music-notes-simple' },
      { n: 'Chords', k: '2 loops', i: 'piano-keys', on: true },
      { n: 'Bass', k: '2 loops', i: 'wave-sine' },
      { n: 'Drums', k: 'muted', i: 'metronome', hid: true },
      { head: 'Tunes you reuse', count: 2 },
      { n: "Keeper's tune", k: 'used 3 times', i: 'diamond', on: false },
      { n: 'Danger sting', k: 'used 2 times', i: 'diamond' },
      { head: 'Other music', count: 3 },
      { n: 'Cave tune', k: '1:04 long', i: 'music-notes' },
      { n: 'Title screen', k: '0:32 long', i: 'music-notes' },
    ],
    foot: '<button class="btn small"><span class="ic" data-i="download-simple"></span>Bring in MIDI</button><button class="btn small"><span class="ic" data-i="export"></span>Save as MIDI</button>',
  },  library: {
    open: true, filters: ['Drums', 'Bass', 'Chords', 'Tunes', 'Yours'], on: 2,
    items: [
      { n: 'Sunny chords', note: '0:08 · in the song', i: 'piano-keys', on: true },
      { n: 'Rainy chords', note: '0:08 · in the song', i: 'piano-keys' },
      { n: 'Big finish', note: '0:04', i: 'piano-keys' },
      { n: 'Night chords', note: '0:08', i: 'piano-keys' },
      { n: 'Brave chords', note: '0:16', i: 'piano-keys' },
      { n: 'Lullaby', note: '0:08', i: 'piano-keys' },
    ],
  },
  closed: [['Changes', 'clock-counter-clockwise'], ['Problems', 'warning']],
  values: {
    title: 'Sunny chords', sub: 'Chords row · 0:00 to 0:16', pic: { i: 'piano-keys' }, tab: 'Sunny chords',
    groups: [
      { name: 'The loop', open: true, rows: [
        { t: 'pick', l: 'Chords', f: 'chords', v: 'Sunny', i: 'sun' },
        { t: 'pick', l: 'Played on', f: 'instrument', v: 'Soft piano', i: 'piano-keys' },
        { t: 'read', l: 'Plays for', f: 'bars', v: '16 seconds' },
      ] },
      { name: 'Feel', count: 1, open: true, rows: [
        { t: 'slider', l: 'How loud', f: 'volume', v: '70%', lo: 'Quiet', hi: 'Loud', at: 70 },
        { t: 'choice', l: 'How it is played', f: 'style', opts: ['Held', 'Picked', 'Bouncy'], on: 0 },
      ] },
      { name: 'Make it yours', open: true, rows: [
        { t: 'btns', b: [['Make a tune to reuse', 'diamond'], ['Change the notes', 'piano-keys']] },
      ] },
    ],
  },
}
</script>
<script src="frame.js"></script>
</body>
</html>
