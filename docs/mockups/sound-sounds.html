<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sound · Sounds (mockup)</title>
<link rel="stylesheet" href="mockup.css">
<link rel="stylesheet" href="shell.css">
<style>
  .wavebox { position: absolute; inset: 10px 16px 12px; display: flex; flex-direction: column; gap: 6px; }
  .wave2 { position: relative; flex: 1; display: flex; align-items: center; gap: 1px; border: 1px solid var(--edge); border-radius: 3px; padding: 0 2px; }
  .wave2 i { flex: 1; background: var(--quiet); border-radius: 1px; }
  .wave2 .cut { position: absolute; top: 0; bottom: 0; background: rgb(17 19 20 / 0.55); }
  .wave2 .trim { position: absolute; top: -4px; bottom: -4px; width: 0; border-left: 3px solid var(--accent); }
  .wave2 .trim::after { content: ""; position: absolute; top: 40%; left: -9px; width: 15px; height: 22px; border-radius: 3px; background: var(--accent); }
  .wave2 .fade { position: absolute; top: 0; bottom: 0; }
  .wave2 .fade svg { width: 100%; height: 100%; }
  .wave2 .wl { position: absolute; top: 4px; font: 500 13px var(--label); color: var(--words); }
  .takes { display: flex; gap: 6px; align-items: center; font-size: 14px; }
  .takes .vpick.on { border-color: var(--accent); color: var(--words); }
  .mixer { position: absolute; inset: 8px 12px; display: flex; gap: 10px; }
  .strip { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 6px; border: 1px solid var(--edge); border-radius: var(--corner); min-width: 0; }
  .strip.on { border-color: var(--accent); }
  .strip b { font: 600 14px var(--label); white-space: nowrap; }
  .meters { flex: 1; display: flex; gap: 10px; align-items: stretch; min-height: 0; }
  .meter { width: 4px; border-radius: 2px; background: var(--edge); position: relative; overflow: hidden; }
  .meter i { position: absolute; left: 0; right: 0; bottom: 0; background: var(--faint); }
  .fader { width: 6px; border-radius: 3px; background: var(--edge); position: relative; }
  .fader i { position: absolute; left: -9px; width: 24px; height: 12px; border-radius: 3px; background: var(--words); border: 2px solid var(--ground); }
  .strip .num { font-size: 12px; color: var(--quiet); }
  .duck { position: absolute; right: 14px; top: 8px; }
  .mixer { overflow-x: auto; } .strip { min-width: 96px; } .mixer .more2 { position: absolute; right: 0; top: 0; bottom: 0; width: 56px; display: none; align-items: center; justify-content: flex-end; padding-right: 6px; background: linear-gradient(90deg, transparent, var(--panel)); color: var(--quiet); font-size: 13px; }
  @media (max-width: 699px) and (min-height: 601px), (max-height: 600px) { .takes .label { display: none; } .mixer .more2 { display: flex; } }
</style>
</head>
<body>
<!-- Sound, Sounds, first look: opens on the level with a chip on everything that makes a sound (the Owner, Q1 = A).
     Every sound of the game is in the list on the left; the picked one's wave is along the bottom with its start, its
     end and its fade to drag, and three takes so a step never sounds the same twice. A sound starts from a kind and
     "Try another" rolls a new one; recorded sounds come in too. -->
<div class="canvas">
  <div class="fit">
    <div class="stage grid">
      <div class="ring" style="left:12.2%;top:72.6%;width:6.6%;height:11.6%"></div>
      <span class="chip" style="left:6%;top:61%"><span class="ic" data-i="speaker-high"></span>Jump</span>
      <span class="chip" style="left:13%;top:89%"><span class="ic" data-i="speaker-high"></span>Land</span>
      <span class="chip" style="left:45%;top:79%"><span class="ic" data-i="speaker-high"></span>Push</span>
      <span class="chip" style="left:62%;top:20%"><span class="ic" data-i="wind"></span>Wind, all the time</span>
    </div>
  </div>
</div>
<script>
window.MOCK = {
  editor: 'sound', parts: [['Sounds', 'speaker-high'], ['Music', 'music-notes']], part: 0,
  tools: [['Pick', 'cursor', 'V'], ['Hand', 'hand', 'H'], ['Record', 'microphone', 'R'], ['Trim', 'scissors', 'T'], ['Play', 'play', 'P']],
  status: { pointer: '0.12', unit: 's', grid: false, snap: false },
  place: 'Level 1', off: [2, 3], jobs: ['Move: pick a sound', 'Place: put a sound on something in the level'], what: 'Level', saved: 'Mia, 20 minutes ago', tool: 0, zoom: '100%',
  settings: [
    '<span>Show sounds of</span><span class="seg"><button class="on">This level</button><button>The whole game</button></span>',
    '<span>Hear them as you pick</span><span class="knob2 on"></span>',
  ],
  list: { title: 'Sounds', count: 14, search: 'Find a sound', rows: [
      { head: 'Hero', count: 4 },
      { n: 'Jump', k: 'made', i: 'arrow-fat-up', on: true },
      { n: 'Land', k: 'made', i: 'arrow-down' },
      { n: 'Step', k: '3 takes', i: 'sneaker' },
      { n: 'Hurt', k: 'recorded', i: 'microphone' },
      { head: 'Crate', count: 2 },
      { n: 'Push', k: 'recorded', i: 'hand' },
      { n: 'Scrape', k: 'made', i: 'wave-sine' },
      { head: 'The level', count: 3 },
      { n: 'Door opens', k: 'made', i: 'door' },
      { n: 'Button', k: 'made', i: 'radio-button' },
      { n: 'Wind', k: 'loops', i: 'wind', warn: false },
    ],
    foot: '<button class="btn small"><span class="ic" data-i="plus"></span>New sound</button><button class="btn small"><span class="ic" data-i="upload-simple"></span>Bring in a recording</button>',
  },
  bottom: { title: 'Jump · 0.42 s', icon: 'wave-sine', html: `<div class="wavebox"><div class="takes"><span class="label">3 versions · one plays at random</span><span class="vpick on">1</span><span class="vpick">2</span><span class="vpick">3</span><button class="btn small"><span class="ic" data-i="dice-five"></span>Try another</button></div><div class="wave2"><i style="height:3%"></i><i style="height:68%"></i><i style="height:101%"></i><i style="height:84%"></i><i style="height:31%"></i><i style="height:37%"></i><i style="height:81%"></i><i style="height:84%"></i><i style="height:54%"></i><i style="height:9%"></i><i style="height:57%"></i><i style="height:75%"></i><i style="height:67%"></i><i style="height:30%"></i><i style="height:31%"></i><i style="height:59%"></i><i style="height:70%"></i><i style="height:47%"></i><i style="height:6%"></i><i style="height:42%"></i><i style="height:65%"></i><i style="height:56%"></i><i style="height:19%"></i><i style="height:24%"></i><i style="height:54%"></i><i style="height:57%"></i><i style="height:31%"></i><i style="height:7%"></i><i style="height:40%"></i><i style="height:51%"></i><i style="height:38%"></i><i style="height:19%"></i><i style="height:24%"></i><i style="height:41%"></i><i style="height:42%"></i><i style="height:30%"></i><i style="height:9%"></i><i style="height:28%"></i><i style="height:40%"></i><i style="height:37%"></i><i style="height:15%"></i><i style="height:14%"></i><i style="height:35%"></i><i style="height:39%"></i><i style="height:23%"></i><i style="height:3%"></i><i style="height:27%"></i><i style="height:36%"></i><i style="height:26%"></i><i style="height:10%"></i><i style="height:19%"></i><i style="height:30%"></i><i style="height:26%"></i><i style="height:18%"></i><i style="height:10%"></i><i style="height:22%"></i><i style="height:22%"></i><i style="height:24%"></i><i style="height:13%"></i><i style="height:13%"></i><i style="height:20%"></i><i style="height:26%"></i><i style="height:18%"></i><i style="height:5%"></i><i style="height:17%"></i><i style="height:25%"></i><i style="height:20%"></i><i style="height:5%"></i><i style="height:12%"></i><i style="height:23%"></i><i style="height:15%"></i><i style="height:8%"></i><i style="height:3%"></i><i style="height:10%"></i><i style="height:14%"></i><i style="height:10%"></i><i style="height:3%"></i><i style="height:6%"></i><i style="height:11%"></i><i style="height:11%"></i><i style="height:6%"></i><i style="height:3%"></i><i style="height:8%"></i><i style="height:11%"></i><i style="height:8%"></i><i style="height:3%"></i><i style="height:5%"></i><i style="height:9%"></i><i style="height:9%"></i><i style="height:4%"></i><i style="height:3%"></i><i style="height:6%"></i><i style="height:8%"></i><i style="height:6%"></i><i style="height:3%"></i><i style="height:4%"></i><i style="height:7%"></i><i style="height:7%"></i><i style="height:3%"></i><i style="height:3%"></i><i style="height:5%"></i><i style="height:7%"></i><i style="height:5%"></i><i style="height:3%"></i><i style="height:3%"></i><i style="height:5%"></i><i style="height:5%"></i><i style="height:3%"></i><i style="height:3%"></i><i style="height:4%"></i><i style="height:5%"></i><i style="height:4%"></i><i style="height:3%"></i><i style="height:3%"></i><i style="height:4%"></i><i style="height:4%"></i><i style="height:3%"></i><i style="height:3%"></i><i style="height:3%"></i><i style="height:4%"></i><span class="cut" style="left:0;width:3%"></span><span class="cut" style="right:0;width:22%"></span><i class="trim" style="left:3%;flex:none"></i><i class="trim" style="left:78%;flex:none"></i><span class="fade" style="left:62%;width:16%"><svg viewBox="0 0 10 10" preserveAspectRatio="none"><path d="M0 0 L10 10" stroke="#eeb480" stroke-width="1.2" vector-effect="non-scaling-stroke" fill="none"/></svg></span><span class="wl" style="left:4%">Starts</span><span class="wl" style="left:63%">Fades out</span></div></div>`,
    head: '<span class="bhead"><button class="iconbtn"><span class="ic" data-i="play"></span></button><span class="num">0.42 s</span></span>' },
  library: { open: false },
  closed: [['Changes', 'clock-counter-clockwise'], ['Problems', 'warning']],
  values: {
    title: 'Jump', sub: 'Hero · jump sound', pic: { i: 'arrow-fat-up' }, tab: 'Jump',
    groups: [
      { name: 'Plays when', open: true, rows: [
        { t: 'pick', f: 'tag', v: 'The hero jumps', i: 'arrow-fat-up' },
        { t: 'slider', l: 'How loud', f: 'volume', v: '80%', lo: 'Quiet', hi: 'Loud', at: 80 },
      ] },
      { name: 'Every time a little different', count: 2, rows: [
        { t: 'slider', l: 'Higher or lower', f: 'vary.pitch', v: 'a little', lo: 'Always the same', hi: 'Very different', at: 30 },
        { t: 'slider', l: 'Louder or softer', f: 'vary.volume', v: 'a little', lo: 'Always the same', hi: 'Very different', at: 20 },
      ] },
      { name: 'Sound', open: true, rows: [
        { t: 'pick', l: 'Starts from', f: 'kind', v: 'Spring sound', i: 'wave-sine' },
        { t: 'btns', b: [['Start again from another sound', 'arrow-counter-clockwise']] },
      ] },
    ],
  },
}
</script>

</body>
