<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sound · Sounds (mockup)</title>
<link rel="stylesheet" href="mockup.css">
<style>
  .wave { display: flex; align-items: center; gap: 2px; height: 56px; padding: 0 4px; border: 1px solid var(--edge); border-radius: 3px; }
  .wave i { flex: 1; background: var(--touch); border-radius: 1px; min-height: 2px; }
  .playrow { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: center; }
  .playrow .btn.main { width: 56px; height: 56px; padding: 0; border-radius: 50%; }
  .playrow .btn.main .ic { width: 26px; height: 26px; }
</style>
</head>
<body>
<!-- Sound, Sounds: opens on the level with a chip on everything that makes a sound (the Owner, Q1 = A). A sound
     starts from a kind, "Try another" rolls a new one, plain sliders shape it; recorded sounds come in too (Q4 = B).
     The Sound spec is still being written, so this follows the Owner's answers. -->
<div class="canvas">
  <div class="fit">
    <div class="stage grid">
      <div class="ring" style="left:12.2%;top:72.6%;width:6.6%;height:11.6%"></div>
      <span class="chip" style="left:6%;top:61%"><span class="ic" data-i="music-note-simple"></span>Jump</span>
      <span class="chip" style="left:13%;top:89%"><span class="ic" data-i="music-note-simple"></span>Land</span>
      <span class="chip" style="left:45%;top:79%"><span class="ic" data-i="music-note-simple"></span>Push</span>
      <span class="chip" style="left:50%;top:3%;transform:translateX(-50%)"><span class="ic" data-i="music-notes"></span>Music: <span class="v">Meadow tune</span></span>
    </div>
  </div>
</div>
<div class="panels">
  <section class="float panel">
    <header class="panel-head">
      <span class="label">The picked sound</span>
      <button class="iconbtn" aria-label="Close"><span class="ic" data-i="x"></span></button>
    </header>
    <div class="panel-body">
      <div class="playrow"><button class="btn main" aria-label="Play"><span class="ic" data-i="play"></span></button><div><h2>Jump</h2><span class="sub">hero · when it jumps</span></div></div>
      <div class="wave" id="wave"></div>
      <div class="choices">
        <button class="choice on"><span class="ic" data-i="arrow-fat-up"></span>Jump</button>
        <button class="choice"><span class="ic" data-i="coin"></span>Coin</button>
        <button class="choice"><span class="ic" data-i="lightning"></span>Hit</button>
        <button class="choice"><span class="ic" data-i="sparkle"></span>Magic</button>
      </div>
      <button class="btn main small"><span class="ic" data-i="dice-five"></span>Try another</button>
      <div class="slider"><span>How high</span><span class="val">Higher</span>
        <div class="track"><button class="square"><span class="ic" data-i="minus"></span></button><div class="rail"><i style="--at:64%"></i></div><button class="square"><span class="ic" data-i="plus"></span></button></div></div>
      <div class="slider"><span>How long</span><span class="val">0.25 s</span>
        <div class="track"><button class="square"><span class="ic" data-i="minus"></span></button><div class="rail"><i style="--at:30%"></i></div><button class="square"><span class="ic" data-i="plus"></span></button></div></div>
      <div class="choices"><button class="btn small"><span class="ic" data-i="microphone"></span>Record your own</button><button class="btn small"><span class="ic" data-i="upload-simple"></span>Use a file</button></div>
    </div>
  </section>
</div>
<script>
window.MOCK = {
  editor: 'sound', place: 'Level 1', saved: 'Mia, 20 minutes ago',
  parts: [['Sounds', 'speaker-high'], ['Music', 'music-notes']], part: 0,
  tools: [['Pick', 'hand-pointing'], ['Add', 'plus'], ['Record', 'microphone'], ['Play', 'play']], tool: 0,
}
const wave = document.getElementById('wave')
for (let i = 0; i < 40; i++) {
  const h = Math.round(100 * Math.exp(-i / 14) * (0.55 + 0.45 * Math.abs(Math.sin(i * 1.7))))
  wave.insertAdjacentHTML('beforeend', `<i style="height:${Math.max(4, h)}%"></i>`)
}
</script>
<script src="frame.js"></script>
</body>
</html>
