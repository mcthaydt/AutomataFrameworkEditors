<!doctype html>
<html lang="en">
<head>

<title>Sound · Music, mid-project (mockup)</title>

<style>
  /* Music as loops on lanes, the way GarageBand does it (the Owner, Q3): whole loops laid out with one press; a motif
     is a tune made once and reused. MIDI goes in and out (Q5). */
  .song { width: 100%; height: 100%; display: grid; grid-template-columns: 190px 1fr; grid-auto-rows: minmax(0, 1fr); grid-template-rows: 26px 26px; gap: 6px 8px; padding: 2px 0; position: relative; }
  .bars { display: grid; grid-template-columns: repeat(var(--n), 1fr); border-bottom: 2px solid var(--words); align-items: end; }
  .bars span { font: 12px var(--measure); color: var(--quiet); padding-left: 3px; border-left: 1px solid var(--edge); overflow: hidden; }
  .sparts { display: grid; grid-template-columns: repeat(var(--n), 1fr); gap: 3px; }
  .sparts span { border-radius: 3px; padding: 3px 8px; font: 500 13px var(--label); color: var(--quiet); background: var(--raised); white-space: nowrap; overflow: hidden; }
  .lanehead { display: flex; flex-wrap: wrap; gap: 4px 6px; align-content: center; align-items: center; padding: 2px 6px 2px 8px; border: 1px solid var(--edge); border-radius: 3px; background: var(--raised); min-width: 0; }
  .lanehead > .ic { color: var(--quiet); }
  .lanehead .label { flex: 1; }
  .lanehead .qsr { display: flex; gap: 4px; }
  .lanehead .label { overflow: hidden; white-space: nowrap; }
  .lanehead .qs { height: 28px; padding: 0 8px; border: 1px solid var(--line); border-radius: 6px; display: inline-flex; gap: 4px; align-items: center; font: 500 12px var(--label); color: var(--quiet); }
  .lanehead .qs .ic { width: 14px; height: 14px; }
  .lanehead .qs.on { background: var(--hover); color: var(--words); border-color: var(--quiet); }
  .lanehead .lv { flex-basis: 100%; height: 4px; border-radius: 2px; background: var(--edge); position: relative; margin: 3px 0 2px; }
  .lanehead .lv i { position: absolute; inset: 0 auto 0 0; background: var(--quiet); border-radius: 2px; }
  .lanehead .lv i::after { content: ""; position: absolute; right: -6px; top: -5px; width: 12px; height: 14px; border-radius: 4px; background: var(--words); }
  .lanehead .lv { margin: 6px 6px 4px 0; }
  .lane { position: relative; display: grid; grid-template-columns: repeat(var(--n), 1fr); gap: 0 3px; background: repeating-linear-gradient(90deg, transparent 0 calc(100% / 4 - 1px), var(--edge) calc(100% / 4 - 1px) calc(100% / 4)); }
  .loop { position: relative; border-radius: 4px; padding: 4px 8px; overflow: hidden; color: var(--words); font: 500 13px/1.2 var(--label); white-space: nowrap; border: 1px solid var(--line); background: var(--raised); }
  .loop.on { background: var(--hover); outline: 2px solid var(--accent); outline-offset: -1px; }
  .loop { overflow: hidden; }
  .loop .nm2 { position: relative; z-index: 4; display: inline-block; max-width: 100%; overflow: hidden; text-overflow: ellipsis; padding: 0 4px; margin-left: -4px; border-radius: 3px; background: inherit; }
  /* A tiny picture of what is inside each block, as music tools draw it. */
  .loop::after { content: ""; position: absolute; left: 8px; right: 8px; top: 26px; bottom: 8px; opacity: 0.9; }
  .drums::after { background: radial-gradient(circle, #6e6e6e 2px, transparent 2.5px) 0 100% / 12px 12px repeat-x, radial-gradient(circle, #555 2px, transparent 2.5px) 6px 0 / 24px 12px repeat-x; }
  .bass::after { background: linear-gradient(#6e6e6e, #6e6e6e) 0 80% / 20px 3px repeat-x, linear-gradient(#6e6e6e, #6e6e6e) 26px 60% / 30px 3px repeat-x; }
  .chords::after { background: repeating-linear-gradient(90deg, #6e6e6e 0 34px, transparent 34px 42px) 0 30% / 100% 3px no-repeat, repeating-linear-gradient(90deg, #555 0 34px, transparent 34px 42px) 0 55% / 100% 3px no-repeat, repeating-linear-gradient(90deg, #555 0 34px, transparent 34px 42px) 0 80% / 100% 3px no-repeat; }
  .tune::after { background: radial-gradient(circle, #8a8a8a 2.5px, transparent 3px) 0 0 / 14px 9px; }
  .drums { } .drums::after { background: repeating-linear-gradient(90deg, var(--nc) 0 3px, transparent 3px 14px); }
  .bass { } .bass::after { background: repeating-linear-gradient(90deg, var(--nc) 0 18px, transparent 18px 26px); clip-path: polygon(0 60%, 100% 60%, 100% 100%, 0 100%); }
  .chords { } .chords::after { background: repeating-linear-gradient(90deg, var(--nc) 0 40px, transparent 40px 48px); }
  .tune { } .tune::after { background: radial-gradient(circle, var(--nc) 2px, transparent 3px) 0 0 / 12px 9px; }
  .tune.copy { color: var(--quiet); }
  .tune .ic { width: 13px; height: 13px; vertical-align: -2px; }
  .ph { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--words); z-index: 3; box-shadow: 0 0 0 1px var(--ground); }
  .roll { position: absolute; inset: 0; display: grid; grid-template-columns: 64px 1fr; }
  .keys { display: grid; grid-auto-rows: 1fr; border-right: 1px solid var(--edge); }
  .keys span { background: #d6d6d6; border-bottom: 1px solid #555; color: #555; font: 11px var(--measure); display: flex; align-items: center; justify-content: flex-end; padding-right: 4px; }
  .keys span.b { background: #2a2a2a; margin-right: 22px; border-radius: 0 3px 3px 0; }
  .grid2 { position: relative; background-image: linear-gradient(90deg, color-mix(in srgb, var(--words) 10%, transparent) 1px, transparent 1px), linear-gradient(color-mix(in srgb, var(--words) 8%, transparent) 1px, transparent 1px); background-size: calc(100% / 16) 100%, 100% calc(100% / 12); }
  .note { position: absolute; height: calc(100% / 12 - 3px); margin-top: 1px; border-radius: 3px; background: var(--quiet); border: 1px solid var(--ground); }
  .note.on { background: var(--words); outline: 2px solid var(--accent); }
  @media (max-width: 699px), (max-height: 600px) { .song { grid-template-columns: 110px 1fr; } .lanehead .qsr { display: none; } }
  .song { overflow: hidden; } .lanehead { overflow: hidden; min-height: 0; }
  @media (max-width: 699px) and (min-height: 601px), (max-height: 600px) { .song { --n: 8 !important; } .bars span:nth-child(n+9), .sparts span:nth-child(n+3), .lane > .loop.late { display: none; } }
  /* The notes inside a block are a step lighter than the block, and orange on the picked one. */
  .loop { --nc: #5c5c5c; } .loop.on { --nc: var(--accent); }
  .lanehead .qsr { flex-basis: 100%; }
  /* On phones a row is 44 high with its icon and name; three show and the rest scroll. Its loudness, Mute and Only
     this are in the inspector when the row is picked. */
  @media (max-width: 500px), (max-height: 600px) {
    .song { grid-auto-rows: 44px; overflow-y: auto; }
    .lanehead { flex-wrap: nowrap; }
    .lanehead .lv, .lanehead .qsr { display: none; }
    .loop::after { top: 20px; bottom: 6px; }
  }
</style>
</head>

<script>
window.MOCK = {
  editor: 'sound', parts: [['Sounds', 'speaker-high'], ['Music', 'music-notes']], part: 1,
  tools: [['Pick', 'cursor', 'V'], ['Hand', 'hand', 'H'], ['Add a loop', 'plus', 'A'], ['Cut', 'scissors', 'C'], ['Pencil', 'pencil-simple', 'B'], ['Erase', 'eraser', 'E'], ['Play', 'play', 'P']],
  status: { pointer: '0:08', unit: '', grid: 'Line up with the beat', snap: false },
  place: 'Meadow tune', off: [3], jobs: ['Move: pick and move a loop', 'Place: add a loop', 'Paint: draw notes'], what: 'Music', saved: 'Not saved: 3 changes', changes: 3, tool: 4, zoom: '2:08', state: 'mid-project',
  settings: ['<span>Speed</span><span class="num">120</span><span>· walking pace</span>', '<span>Tick along</span><span class="knob2"></span>', '<span class="num">0:08</span>'],
  list: { title: 'The song', count: 9, search: 'Find a loop or tune', rows: [
      { head: 'Rows', count: 4 },
      { n: 'Tune', k: '2 loops', i: 'music-notes-simple' },
      { n: 'Chords', k: '2 loops', i: 'piano-keys', on: false },
      { n: 'Bass', k: '2 loops', i: 'wave-sine' },
      { n: 'Drums', k: 'muted', i: 'metronome', hid: true },
      { head: 'Tunes you reuse', count: 2 },
      { n: "Keeper's tune", k: 'used 6 times', i: 'diamond', on: true },
      { n: 'Danger sting', k: 'used 2 times', i: 'diamond' },
      { head: 'Other music', count: 3 },
      { n: 'Cave tune', k: '1:04 long', i: 'music-notes' },
