<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sound · Music, mid-project (mockup)</title>
<link rel="stylesheet" href="mockup.css">
<style>
  /* Music as loops on lanes, the way GarageBand does it (the Owner, Q3): whole loops laid out with one press; a motif
     is a tune made once and reused. MIDI goes in and out (Q5). */
  .song { width: 100%; height: 100%; display: grid; grid-template-columns: 170px 1fr; grid-auto-rows: minmax(0, 1fr); grid-template-rows: 26px 26px; gap: 6px 8px; padding: 2px 0; position: relative; }
  .bars { display: grid; grid-template-columns: repeat(var(--n), 1fr); border-bottom: 2px solid var(--words); align-items: end; }
  .bars span { font: 12px var(--measure); color: var(--quiet); padding-left: 3px; border-left: 1px solid var(--edge); overflow: hidden; }
  .sparts { display: grid; grid-template-columns: repeat(var(--n), 1fr); gap: 3px; }
  .sparts span { border-radius: 3px; padding: 3px 8px; font: 600 12px var(--label); letter-spacing: .06em; text-transform: uppercase; color: var(--ground); white-space: nowrap; overflow: hidden; }
  .lanehead { display: grid; grid-template-columns: auto 1fr auto auto; grid-template-rows: auto auto; column-gap: 6px; align-items: center; padding: 2px 6px 2px 8px; border: 1px solid var(--edge); border-radius: 3px; background: var(--raised); min-width: 0; }
  .lanehead .ic { color: var(--touch); }
  .lanehead .label { overflow: hidden; white-space: nowrap; }
  .lanehead .qs { width: 26px; height: 24px; border: 1px solid var(--edge); border-radius: 3px; display: grid; place-items: center; font: 600 12px var(--label); }
  .lanehead .qs.on { background: var(--touch); color: var(--ground); border-color: var(--touch); }
  .lanehead .lv { grid-column: 1 / -1; height: 4px; border-radius: 2px; background: var(--edge); position: relative; margin: 3px 0 2px; }
  .lanehead .lv i { position: absolute; inset: 0 auto 0 0; background: var(--touch); border-radius: 2px; }
  .lane { position: relative; display: grid; grid-template-columns: repeat(var(--n), 1fr); gap: 0 3px; background: repeating-linear-gradient(90deg, transparent 0 calc(100% / 4 - 1px), var(--edge) calc(100% / 4 - 1px) calc(100% / 4)); }
  .loop { position: relative; border-radius: 4px; padding: 4px 8px; overflow: hidden; color: var(--ground); font: 600 13px/1.2 var(--label); white-space: nowrap; border: 1px solid var(--ground); }
  .loop.on { outline: 3px solid var(--words); outline-offset: -1px; }
  .loop::after { content: ""; position: absolute; left: 6px; right: 6px; bottom: 6px; top: 24px; opacity: 0.45; }
  .drums { background: #c9c37a; } .drums::after { background: repeating-linear-gradient(90deg, var(--ground) 0 3px, transparent 3px 14px); }
  .bass { background: #e8a06a; } .bass::after { background: repeating-linear-gradient(90deg, var(--ground) 0 18px, transparent 18px 26px); clip-path: polygon(0 60%, 100% 60%, 100% 100%, 0 100%); }
  .chords { background: #d7cfa0; } .chords::after { background: repeating-linear-gradient(90deg, var(--ground) 0 40px, transparent 40px 48px); }
  .tune { background: var(--touch); box-shadow: inset 0 0 0 2px var(--words); } .tune::after { background: radial-gradient(circle, var(--ground) 2px, transparent 3px) 0 0 / 12px 9px; }
  .tune.copy { background: color-mix(in srgb, var(--touch) 70%, var(--ground)); }
  .tune .ic { width: 13px; height: 13px; vertical-align: -2px; }
  .ph { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--words); z-index: 3; box-shadow: 0 0 0 1px var(--ground); }
  .roll { position: absolute; inset: 0; display: grid; grid-template-columns: 64px 1fr; }
  .keys { display: grid; grid-auto-rows: 1fr; border-right: 1px solid var(--edge); }
  .keys span { font: 11px var(--measure); color: var(--quiet); padding-left: 6px; display: flex; align-items: center; border-bottom: 1px solid color-mix(in srgb, var(--words) 10%, transparent); }
  .keys span.b { background: rgb(17 19 20 / 0.35); }
  .grid2 { position: relative; background-image: linear-gradient(90deg, color-mix(in srgb, var(--words) 10%, transparent) 1px, transparent 1px), linear-gradient(color-mix(in srgb, var(--words) 8%, transparent) 1px, transparent 1px); background-size: calc(100% / 16) 100%, 100% calc(100% / 12); }
  .note { position: absolute; height: calc(100% / 12 - 3px); margin-top: 1px; border-radius: 3px; background: var(--touch); border: 1px solid var(--ground); }
  .note.on { background: var(--words); }
  @media (max-width: 1000px), (max-height: 600px) { .song { grid-template-columns: 110px 1fr; } .lanehead .qs { display: none; } }
  @media (max-width: 699px) and (min-height: 601px), (max-height: 600px) { .song { --n: 8 !important; } .bars span:nth-child(n+9), .sparts span:nth-child(n+3), .lane > .loop.late { display: none; } }
</style>
</head>
<body>
<!-- Sound, Music, mid-project: the whole song, 64 bars on five lanes, zoomed out, with the motif picked everywhere it is
     used. Its notes are open along the bottom on a grid of notes, the way music tools show them; change a note once
     and every copy of the motif changes. -->

  <div class="fit">
    <div class="song" style="--n:64;grid-template-rows:26px 22px"><span class="label" style="align-self:center">Parts <span class="soon">Soon</span></span><div class="sparts"><span style="grid-column:1/17;background:#afd472">Calm</span><span style="grid-column:17/33;background:#f37f94">Danger</span><span style="grid-column:33/49;background:#afd472">Calm</span><span style="grid-column:49/65;background:#9fd3f0">Won</span></div><span></span><div class="bars"><span>1</span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span>9</span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span>17</span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span>25</span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span>33</span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span>41</span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span>49</span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span>57</span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div><div class="lanehead"><span class="ic" data-i="music-notes-simple"></span><span class="label">Tune</span><span class="qs">Q</span><span class="qs on">S</span><span class="lv"><i style="width:60%"></i></span></div><div class="lane"><div class="loop tune on" style="grid-column:1/5"><span class='ic' data-i='diamond'></span></div><div class="loop tune copy on" style="grid-column:5/13"><span class='ic' data-i='diamond'></span></div><div class="loop tune copy" style="grid-column:17/23"><span class='ic' data-i='diamond'></span></div><div class="loop tune copy" style="grid-column:23/29"><span class='ic' data-i='diamond'></span></div><div class="loop tune copy" style="grid-column:29/37"><span class='ic' data-i='diamond'></span></div><div class="loop tune copy" style="grid-column:39/45"><span class='ic' data-i='diamond'></span></div><div class="loop tune copy" style="grid-column:45/49"><span class='ic' data-i='diamond'></span></div><div class="loop tune copy" style="grid-column:53/59"><span class='ic' data-i='diamond'></span></div><div class="loop tune copy" style="grid-column:63/65"><span class='ic' data-i='diamond'></span></div><i class="ph" style="left:7%"></i></div><div class="lanehead"><span class="ic" data-i="piano-keys"></span><span class="label">Chords</span><span class="qs">Q</span><span class="qs">S</span><span class="lv"><i style="width:60%"></i></span></div><div class="lane"><div class="loop chords" style="grid-column:3/7"></div><div class="loop chords" style="grid-column:7/13"></div><div class="loop chords" style="grid-column:17/21"></div><div class="loop chords" style="grid-column:21/25"></div><div class="loop chords" style="grid-column:25/33"></div><div class="loop chords" style="grid-column:33/41"></div><div class="loop chords" style="grid-column:45/51"></div><div class="loop chords" style="grid-column:55/63"></div><i class="ph" style="left:7%"></i></div><div class="lanehead"><span class="ic" data-i="wave-sine"></span><span class="label">Bass</span><span class="qs">Q</span><span class="qs">S</span><span class="lv"><i style="width:60%"></i></span></div><div class="lane"><div class="loop bass" style="grid-column:1/7"></div><div class="loop bass" style="grid-column:11/15"></div><div class="loop bass" style="grid-column:17/21"></div><div class="loop bass" style="grid-column:21/25"></div><div class="loop bass" style="grid-column:29/33"></div><div class="loop bass" style="grid-column:35/43"></div><div class="loop bass" style="grid-column:45/53"></div><div class="loop bass" style="grid-column:57/63"></div><i class="ph" style="left:7%"></i></div><div class="lanehead"><span class="ic" data-i="metronome"></span><span class="label">Drums</span><span class="qs">Q</span><span class="qs">S</span><span class="lv"><i style="width:60%"></i></span></div><div class="lane"><div class="loop drums" style="grid-column:3/9"></div><div class="loop drums" style="grid-column:13/19"></div><div class="loop drums" style="grid-column:19/27"></div><div class="loop drums" style="grid-column:27/35"></div><div class="loop drums" style="grid-column:35/43"></div><div class="loop drums" style="grid-column:43/47"></div><div class="loop drums" style="grid-column:49/57"></div><div class="loop drums" style="grid-column:57/61"></div><i class="ph" style="left:7%"></i></div><div class="lanehead"><span class="ic" data-i="music-note-simple"></span><span class="label">Bells</span><span class="qs">Q</span><span class="qs">S</span><span class="lv"><i style="width:60%"></i></span></div><div class="lane"><div class="loop chords" style="grid-column:1/9"></div><div class="loop chords" style="grid-column:9/17"></div><div class="loop chords" style="grid-column:17/25"></div><div class="loop chords" style="grid-column:25/29"></div><div class="loop chords" style="grid-column:31/39"></div><div class="loop chords" style="grid-column:43/47"></div><div class="loop chords" style="grid-column:47/53"></div><div class="loop chords" style="grid-column:53/61"></div><div class="loop chords" style="grid-column:63/65"></div><i class="ph" style="left:7%"></i></div></div>
  </div>
</div>
<script>
window.MOCK = {
  editor: 'sound', parts: [['Sounds', 'speaker-high'], ['Music', 'music-notes']], part: 1,
  tools: [['Pick', 'cursor', 'V'], ['Hand', 'hand', 'H'], ['Add a loop', 'plus', 'A'], ['Cut', 'scissors', 'C'], ['Pencil', 'pencil-simple', 'B'], ['Erase', 'eraser', 'E'], ['Play', 'play', 'P']],
  status: { pointer: 'bar 5', unit: 'beat 1', grid: 'Snap: 1 bar', snap: false },
  place: 'Meadow tune', what: 'Music', saved: 'Not saved: 3 changes', changes: 3, tool: 4, zoom: '64 bars', state: 'mid-project',
  settings: ['<button class="iconbtn"><span class="ic" data-i="play"></span></button><button class="iconbtn"><span class="ic" data-i="stop"></span></button><button class="iconbtn on"><span class="ic" data-i="repeat"></span></button>', '<span class="num">120</span><span>beats a minute</span>', '<span>Key</span><span class="vpick">C major</span>', '<span>Click</span><span class="knob2"></span>', '<span class="num">5.1.1</span>'],
  list: { title: 'The song', count: 9, search: 'Find a loop or motif', rows: [
      { head: 'Lanes', count: 4 },
      { n: 'Tune', k: '2 loops', i: 'music-notes-simple' },
      { n: 'Chords', k: '2 loops', i: 'piano-keys', on: false },
      { n: 'Bass', k: '2 loops', i: 'wave-sine' },
      { n: 'Drums', k: 'quiet', i: 'metronome', hid: true },
      { head: 'Motifs', count: 2 },
      { n: "Keeper's tune", k: 'used 6 times', i: 'diamond', on: true },
      { n: 'Danger sting', k: 'used 2 times', i: 'diamond' },
      { head: 'Other music', count: 3 },
      { n: 'Cave tune', k: '32 bars', i: 'music-notes' },
      { n: 'Title screen', k: '16 bars', i: 'music-notes' },
    ],
    foot: '<button class="btn small"><span class="ic" data-i="download-simple"></span>Bring in MIDI</button><button class="btn small"><span class="ic" data-i="export"></span>Save as MIDI</button>',
  },
  bottom: { title: "Keeper's tune · notes", icon: 'piano-keys', html: `<div class="roll"><div class="keys"><span class="">B</span><span class="b">A#</span><span class="">A</span><span class="b">G#</span><span class="">G</span><span class="b">F#</span><span class="">F</span><span class="">E</span><span class="b">D#</span><span class="">D</span><span class="b">C#</span><span class="">C5</span></div><div class="grid2"><i class="note" style="left:0.00%;width:calc(12.50% - 3px);top:58.33%"></i><i class="note" style="left:12.50%;width:calc(12.50% - 3px);top:50.00%"></i><i class="note on" style="left:25.00%;width:calc(25.00% - 3px);top:33.33%"></i><i class="note" style="left:50.00%;width:calc(12.50% - 3px);top:50.00%"></i><i class="note" style="left:62.50%;width:calc(12.50% - 3px);top:58.33%"></i><i class="note" style="left:75.00%;width:calc(25.00% - 3px);top:75.00%"></i><i class="ph" style="left:30%"></i></div></div>`,
    head: '<span class="bhead"><button class="iconbtn"><span class="ic" data-i="play"></span></button><span class="num">4 bars</span><span class="seg hide-narrow"><button>Whole</button><button class="on">Half</button><button>Quarter</button></span></span>' },
  library: { open: false },
  closed: [['Changes', 'clock-counter-clockwise', 3], ['Problems', 'warning']],
  values: {
    title: "Keeper's tune", sub: 'Motif · used 6 times', pic: { i: 'diamond' }, tab: "Keeper's tune",
    groups: [
      { name: 'The motif', open: true, rows: [
        { l: 'Change it once and every copy changes.' },
        { t: 'pick', l: 'Played on', f: 'instrument', v: 'Flute', i: 'music-note-simple' },
        { t: 'num', l: 'Notes', v: '6' },
      ] },
      { name: 'The picked note', open: true, rows: [
        { t: 'pick', l: 'Note', f: 'notes[2].pitch', v: 'G', i: 'music-note-simple' },
        { t: 'num', l: 'Starts on beat', f: 'notes[2].at', v: '2.1' },
        { t: 'num', l: 'Lasts', f: 'notes[2].length', v: '1', u: 'beat', ch: true },
        { t: 'slider', l: 'How hard', f: 'notes[2].velocity', v: '80', lo: 'Soft', hi: 'Hard', at: 80 },
      ] },
      { name: 'Where it is used', count: 6, rows: [] },

}
</script>
