<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Story · Cutscenes, mid-project (mockup)</title>
<link rel="stylesheet" href="mockup.css">
<link rel="stylesheet" href="shell.css">
<style>
  .camframe { position: absolute; z-index: 2; border: 2px solid var(--accent); box-shadow: 0 0 0 9999px rgb(17 19 20 / 0.35); }
  .camframe > span { position: absolute; left: -2px; top: -24px; padding: 3px 8px; background: var(--panel); color: var(--words); font: 500 14px var(--label); white-space: nowrap; border-radius: 6px 6px 0 0; }
  .walkpath { position: absolute; inset: 0; z-index: 2; width: 100%; height: 100%; }
  .tlbox { position: absolute; z-index: 4; border: 1px dashed var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); }
  .ease svg { width: 100%; height: 90px; display: block; border: 1px solid var(--edge); border-radius: 3px; background: var(--ground); }
</style>
</head>
<body>
<!-- Story, Cutscenes, mid-project: three stops picked with a box across the camera and the door rows, moved together, and
     the way the camera eases between them drawn as a curve to bend. -->
<div class="canvas">
  <div class="fit">
    <div class="stage">
      <div class="camframe" style="left:40%;top:20%;width:46%;height:46%"><span>What the camera sees at 2.5 seconds</span></div>
      <span data-pixel="keeper" data-scale="2" style="position:absolute;z-index:3;left:62%;top:66%"></span>
      <div class="door" style="position:absolute;z-index:1;left:86%;top:63.9%;width:6.2%;height:19.4%;background:#587382;border:3px solid #111314"></div>
    </div>
  </div>
</div>
<script>
window.MOCK = {
  editor: 'story', parts: [['Conversations', 'chat-circle-text'], ['Cutscenes', 'film-slate'], ['Words', 'translate']], part: 1,
  tools: [['Pick', 'cursor', 'V'], ['Hand', 'hand', 'H'], ['Add a camera stop', 'diamond', 'K'], ['Camera', 'video-camera', 'C'], ['Erase', 'eraser', 'E'], ['Play', 'play', 'P']],
  status: { pointer: false, grid: 'Snap: ¼ second', snap: true },
  place: 'Door opens', off: [2], jobs: ['Move: pick and move a stop', 'Place: add a camera stop', '', 'Draw path: draw where someone walks'], what: 'Cutscene', saved: 'Not saved: 2 changes', changes: 2, tool: 0, zoom: '100%', state: 'mid-project', picked: 3,
  settings: [
        '<button class="btn small"><span class="ic" data-i="arrows-horizontal"></span>Space the picked stops evenly</button>',
  ],
  list: { title: 'Cutscenes', count: 3, search: 'Find a cutscene', rows: [
      { head: 'Level 1', count: 2 },
      { n: 'Door opens', k: '4 s', i: 'film-slate', on: true },
      { n: 'Well done', k: '3 s', i: 'film-slate' },
      { head: 'Level 2', count: 1 },
      { n: 'Into the cave', k: '9 s', i: 'film-slate' },
    ],
    foot: '<button class="btn small"><span class="ic" data-i="plus"></span>New cutscene</button>',
  },
  bottom: {
    title: 'Door opens · 4 seconds', icon: 'film-slate',
    head: '<span class="bhead"><span class="num">2.5 seconds</span></span>',
    html: '<i class="tlbox" style="left:calc(var(--tl-name, 150px) + (100% - var(--tl-name, 150px)) * 0.34);width:calc((100% - var(--tl-name, 150px)) * 0.34);top:calc(var(--tl-row, 30px) * 1.9);height:calc(var(--tl-row, 30px) * 3.2)"></i>',
    tl: { unit: 'seconds', ruler: ['0', '1', '2', '3', '4'], cols: 16, at: 0.375, rows: [
      { n: 'Moments', i: 'flag-pennant', evts: [[25, 'Door starts'], [75, 'Player takes over']] },
      { n: 'Camera', i: 'video-camera', keys: [0, 37.5, 62.5, 100], onKey: 2, on: true },
      { n: 'Keeper', i: 'person', bars: [[0, 50, 'Walks to the door'], [50, 100, 'Waves', 'b2']] },
      { n: 'Door', i: 'door', keys: [25, 50], onKey: 1 },
      { n: 'Words', i: 'chat-circle-text', bars: [[6, 44, '“Off you go, then.”', 'b3']] },
      { n: 'Music', i: 'music-notes', bars: [[0, 100, 'Meadow tune, quieter', 'b4']] },
      { n: 'Sound', i: 'speaker-high', evts: [[25, 'Creak'], [50, 'Thud']] },
    ] },
  },
  library: { open: false },
  closed: [['Changes', 'clock-counter-clockwise', 2], ['Problems', 'warning']],
  values: {
    title: '3 stops', sub: 'Camera and door · picked together', pic: { i: 'diamond' }, tab: '3 stops',
    groups: [
      { name: 'Time', open: true, rows: [
        { t: 'num', l: 'Move all later by', v: '0.2', u: 'seconds', ch: true },
        { t: 'btns', b: [['Copy', 'copy'], ['Space evenly', 'arrows-horizontal'], ['Erase', 'eraser']] },
      ] },
      { name: 'Getting there', open: true, rows: [
        { t: 'choice', l: 'Moves', f: 'ease', opts: ['Steady', 'Smooth', 'Snappy', 'My own'], on: 3 },
        { t: 'html', h: '<div class="ease"><svg viewBox="0 0 100 50" preserveAspectRatio="none"><path d="M4 46 C40 46, 50 6, 96 4" fill="none" stroke="#eeb480" stroke-width="2" vector-effect="non-scaling-stroke"/><circle cx="40" cy="46" r="3" fill="#ededed"/><circle cx="50" cy="6" r="3" fill="#ededed"/></svg></div>' },
      ] },
    ],
  },
}
</script>
<script src="frame.js"></script>
</body>
</html>
