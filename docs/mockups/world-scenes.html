<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>World · Scenes (mockup)</title>
<link rel="stylesheet" href="mockup.css">
<style>
  .bracket { position: absolute; z-index: 2; border: 2px dashed var(--words); border-top: 0; height: 12px; }
  .timeofday { display: grid; grid-template-columns: repeat(4, 1fr); text-align: center; gap: 4px; }
  .timeofday span { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 14px; color: var(--quiet); }
  .timeofday span.on { color: var(--touch); }
</style>
</head>
<body>
<!-- World, Scenes: the 2D environment builder (spec: Editors PR 31). The scene is the demo's meadow, which today is
     the first level's own art; the tree is picked, the hills layer shows how fast it slides. -->
<div class="canvas">
  <div class="fit">
    <div class="stage grid">
      <div class="ring" style="left:33%;top:59.6%;width:9%;height:19.5%;border-radius:50% 50% 3px 3px"></div>
      <span class="chip" style="left:43%;top:58%"><span class="ic" data-i="tree"></span>Tree-2</span>
      <div class="vline" style="left:44%;top:66%;height:13%"></div>
      <span class="chip" style="left:45.2%;top:69%">How tall <span class="v">2 tiles</span></span>
      <span class="chip" style="left:73%;top:52%"><span class="ic" data-i="stack"></span>Hills · slides <span class="v">30%</span></span>
      <div class="bracket" style="left:7%;width:24%;top:86.5%"></div>
      <span class="chip" style="left:9%;top:90.5%">Furnished: meadow</span>
    </div>
  </div>
</div>
<div class="panels">
  <div class="closed">
    <button class="chipbtn"><span class="ic" data-i="stack"></span>Layers</button>
    <button class="chipbtn"><span class="ic" data-i="palette"></span>Materials</button>
  </div>
  <section class="float panel">
    <header class="panel-head">
      <nav class="tabs"><button class="on">Tree</button><button>Light and sky</button><button>Layers</button><button>Materials</button></nav>
      <span class="label">The picked thing</span>
      <button class="iconbtn" aria-label="Close"><span class="ic" data-i="x"></span></button>
    </header>
    <div class="panel-body">
      <div><h2>Tree</h2><span class="sub">tree-2 · in front</span></div>
      <div class="stepper"><span>How tall</span><button class="square"><span class="ic" data-i="minus"></span></button><span class="val">2</span><button class="square"><span class="ic" data-i="plus"></span></button></div>
      <div class="stepper"><span>How leafy</span><button class="square"><span class="ic" data-i="minus"></span></button><span class="val">0.8</span><button class="square"><span class="ic" data-i="plus"></span></button></div>
      <div class="choices">
        <button class="btn main small"><span class="ic" data-i="dice-five"></span>Another one</button>
        <button class="btn small"><span class="ic" data-i="flip-horizontal"></span>Flip</button>
        <button class="btn small"><span class="ic" data-i="stack"></span>Behind</button>
      </div>
    </div>
  </section>
  <section class="float panel second">
    <header class="panel-head">
      <span class="label">Light and sky</span>
      <button class="iconbtn" aria-label="Close"><span class="ic" data-i="x"></span></button>
    </header>
    <div class="panel-body">
      <div class="slider"><span>Time of day</span><span class="val">Day</span>
        <div class="track"><button class="square"><span class="ic" data-i="minus"></span></button><div class="rail"><i style="--at:38%"></i></div><button class="square"><span class="ic" data-i="plus"></span></button></div>
      </div>
      <div class="timeofday">
        <span><span class="ic" data-i="sun-horizon"></span>Dawn</span><span class="on"><span class="ic" data-i="sun"></span>Day</span><span><span class="ic" data-i="sun-dim"></span>Dusk</span><span><span class="ic" data-i="moon"></span>Night</span>
      </div>
      <div class="switch"><span class="ic touch" data-i="cloud-rain"></span>Rain<span class="knob"></span></div>
      <div class="switch on"><span class="ic touch" data-i="leaf"></span>Falling leaves<span class="knob"></span></div>
    </div>
  </section>
</div>
<script>
window.MOCK = {
  editor: 'world', place: 'Meadow', what: 'Scene', saved: 'Sam, 5 minutes ago',
  parts: [['Levels', 'squares-four'], ['Tiles', 'grid-four'], ['Scenes', 'mountains']], part: 2,
  tools: [['Move', 'arrows-out-cardinal'], ['Paint', 'paint-brush'], ['Add', 'plus'], ['Erase', 'eraser'], ['Play', 'play']], tool: 0,
}
</script>
<script src="frame.js"></script>
</body>
</html>
