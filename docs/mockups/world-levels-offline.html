<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>World · Couldn't put them in (mockup)</title>
<link rel="stylesheet" href="mockup.css">
<link rel="stylesheet" href="shell.css">
</head>
<body>
<!-- When putting changes in fails (the end-to-end check, E10): here, the iPad has no internet. The sheet says what happened in plain words, that nothing is lost (the changes stay on this iPad), and one thing to press. The top bar says "No internet" until it comes back, and the changes go in by themselves then only if the person presses Try again: nothing goes in the game without them. -->
<style>
  /* A gate (a button opens it) is bars, so it never looks like a door into another level. */
  .gate { position: absolute; z-index: 1; left: 86%; top: 63.9%; width: 6.2%; height: 19.4%; background: repeating-linear-gradient(90deg, #587382 0 20%, transparent 20% 33%); border: 3px solid #111314; border-radius: 3px 3px 0 0; }
  .press { position: absolute; z-index: 1; left: 70.5%; top: 81%; width: 5.4%; height: 2.6%; background: #c4566c; border: 2px solid #111314; border-radius: 3px 3px 0 0; }
</style>
<div class="canvas">
  <div class="fit">
    <div class="stage grid">
      <img class="thing" src="art/crate.png" alt="" style="left:50%;top:73.8%">
      <img class="thing" src="art/crate.png" alt="" style="left:56.25%;top:73.8%">
      <img class="thing" src="art/crate.png" alt="" style="left:56.25%;top:64.2%">
      <img class="thing" src="art/crate.png" alt="" style="left:76%;top:78%">
      <div class="ring warn" style="left:75.4%;top:77.2%;width:7.4%;height:11.4%"></div>
      <div class="gate"></div>
      <div class="press"></div>
      <svg class="links" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
        <path d="M73 81 C 76 60, 84 56, 89 64" fill="none" stroke="#eeb480" stroke-width="0.5" stroke-dasharray="1.4 1"/>
      </svg>
      <div class="zone" style="left:6.3%;top:56%;width:12.5%;height:27.4%"><span>Start</span></div>
      <div class="zone" style="left:6.3%;top:87%;width:87.4%;height:5%"><span>Fall in here and you start again</span></div>
    </div>
  </div>
</div>
<div class="dim" style="background:rgb(0 0 0 / 0.25)"></div>
<section class="pop share-pop">
  <h3>Put 3 changes in the game</h3>
  <div class="oops"><b><span class="ic" data-i="cloud"></span>Couldn't put them in</b><p>This iPad isn't on the internet. Your 3 changes are safe on it: nothing is lost.</p></div>
  <div class="sc"><img src="art/crate.png" alt="">Moved 3 crates<small>Level 1</small></div>
  <div class="sc"><img src="art/crate.png" alt="">Made crates heavier<small>Every crate</small></div>
  <div class="sc"><span class="pic"><span class="ic" data-i="gate"></span></span>Added a gate<small>Level 1</small></div>
  <div class="go"><button class="sbtn main"><span class="ic" data-i="arrows-clockwise"></span>Try again</button><button class="sbtn">Not now</button></div>
</section>
<script>
window.MOCK = {
  editor: 'world', place: 'Level 1', saved: 'Not saved: 3 changes', zoom: '100%', changes: 3, offline: true, state: 'no internet',
  parts: [['Levels', 'squares-four'], ['Tiles', 'grid-four'], ['Scenes', 'mountains']], part: 0,
  tools: [
    ['Pick', 'cursor', 'V'], ['Hand', 'hand', 'H'], ['Add', 'plus', 'A', true], ['Link', 'link', 'L'],
