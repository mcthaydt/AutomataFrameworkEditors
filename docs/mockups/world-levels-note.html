<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>World · A note opened (mockup)</title>
<link rel="stylesheet" href="mockup.css">
<link rel="stylesheet" href="shell.css">
</head>
<body>
<!-- A teammate's note opened (the end-to-end actions check, M13). Tapping a pinned note opens it as a small sheet: what was said and by whom, the answers so far, a box to answer in, and "Done: hide this note" for when it has been dealt with. The note folds back to its pin when the sheet closes. Anyone who may look can read and answer. -->
<style>
  /* A gate (a button opens it) is bars, so it never looks like a door into another level. */
  .gate { position: absolute; z-index: 1; left: 86%; top: 63.9%; width: 6.2%; height: 19.4%; background: repeating-linear-gradient(90deg, #587382 0 20%, transparent 20% 33%); border: 3px solid #111314; border-radius: 3px 3px 0 0; }
  .press { position: absolute; z-index: 1; left: 70.5%; top: 81%; width: 5.4%; height: 2.6%; background: #c4566c; border: 2px solid #111314; border-radius: 3px 3px 0 0; }
</style>
<div class="canvas">
  <div class="fit">
    <div class="stage grid">
      <img class="thing" src="art/crate.png" alt="" style="left:50%;top:73.8%">
      <img class="thing" src="art/crate.png" alt="" style="left:56.25%;top:73.8%">
      <img class="thing" src="art/crate.png" alt="" style="left:56.25%;top:64.2%">
      <img class="thing" src="art/crate.png" alt="" style="left:76%;top:78%">
      <div class="ring warn" style="left:75.4%;top:77.2%;width:7.4%;height:11.4%"></div>
      <div class="gate"></div>
      <div class="press"></div>
      <svg class="links" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
        <path d="M73 81 C 76 60, 84 56, 89 64" fill="none" stroke="#eeb480" stroke-width="0.5" stroke-dasharray="1.4 1"/>
      </svg>
      <div class="zone" style="left:6.3%;top:56%;width:12.5%;height:27.4%"><span>Start</span></div>
      <div class="zone" style="left:6.3%;top:87%;width:87.4%;height:5%"><span>Fall in here and you start again</span></div>

    </div>
  </div>
</div>
<div class="dim" style="background:rgb(0 0 0 / 0.25)"></div><section class="pop share-pop" role="dialog" aria-label="A note from Mia">
  <div class="hdr"><h3>A note from Mia</h3><button class="sbtn"><span class="ic" data-i="x"></span>Close</button></div>
  <div class="thread">
    <div class="said"><b>Mia · 10 minutes ago, on Gate 1</b>Can the hero still jump over the gate when it is open?<small>Pinned on Gate 1</small></div>
    <div class="said mine"><b>Lee · 4 minutes ago</b>I think so. I tried it and it was fine.</div>
  </div>
  <div class="tarea">Write an answer</div>
  <div class="go"><button class="sbtn main"><span class="ic" data-i="paper-plane-tilt"></span>Send answer</button><button class="sbtn"><span class="ic" data-i="check"></span>Done: hide this note</button></div>
</section>
<script src="base.js"></script>
<script>
window.MOCK = {
  ...BASE.mid, closed: [['Changes', 'clock-counter-clockwise', 3], ['Problems', 'warning']],
}
</script>
<script src="frame.js"></script>
</body>
</html>
