<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>World · Tiles (mockup)</title>
<link rel="stylesheet" href="mockup.css">
<link rel="stylesheet" href="shell.css">
<style>
  /* Tiles has no spec yet: the mockup's guess. A tile drawn pixel by pixel on a canvas that fills the space, a preview
     at the game's own size, the tiles of the set on the left and every value of the picked tile on the right. */
  .board { display: flex; gap: 28px; align-items: center; justify-content: center; width: 100%; height: 100%; }
  .big { position: relative; border: 1px solid var(--words); line-height: 0; }
  .big canvas { width: min(84cqh, 58cqw); height: auto; image-rendering: pixelated; }
  /* The colours sit beside the drawing, as in every drawing app: tap one to paint with it, the dropper takes one
     from the tile. */
  .strip { display: flex; flex-direction: column; gap: 6px; padding: 6px; border-radius: 12px; background: var(--panel); border: 1px solid var(--line); }
  .strip i { width: 40px; height: 40px; border-radius: 8px; border: 1px solid rgb(0 0 0 / 0.35); }
  .strip i.on { outline: 2px solid var(--accent); outline-offset: 2px; }
  .strip button { width: 40px; height: 40px; border: 0; border-radius: 8px; background: var(--raised); color: var(--words); display: grid; place-items: center; }
  .strip button .ic { width: 20px; height: 20px; }
  .big::after { content: ""; position: absolute; inset: 0; background-image: linear-gradient(rgb(17 19 20 / 0.3) 1px, transparent 1px), linear-gradient(90deg, rgb(17 19 20 / 0.3) 1px, transparent 1px); background-size: 6.25% 6.25%; }
  .big .cursor { position: absolute; z-index: 2; width: 6.25%; height: 6.25%; outline: 3px solid var(--accent); outline-offset: -1px; }
  .mirror { position: absolute; z-index: 2; top: -8px; bottom: -8px; left: 50%; border-left: 2px dashed var(--touch); }
  .side { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
  .patch { display: grid; grid-template-columns: repeat(6, auto); line-height: 0; border: 1px solid var(--edge); }
  .patch canvas { width: min(5.5cqh, 4cqw); height: auto; image-rendering: pixelated; }
  .patch.real canvas { width: 16px; }
  .patch > span:empty { width: min(5.5cqh, 4cqw); aspect-ratio: 1; }
  .ramp { display: flex; gap: 0; margin: 2px 0; }
  .ramp i { flex: 1; height: 30px; border: 1px solid rgb(17 19 20 / 0.4); }
  .ramp i.on { outline: 3px solid var(--accent); outline-offset: -3px; }
  .rules { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; width: clamp(120px, 24cqh, 200px); }
  .rules i { aspect-ratio: 1; border: 1px solid var(--edge); border-radius: 2px; }
  .rules i.y { background: var(--touch); }
  .rules i.n { background: repeating-linear-gradient(45deg, var(--mark) 0 3px, transparent 3px 7px); }
  .rules i.me { background: var(--accent); }
  @media (max-width: 1000px), (max-height: 600px) { .side .sub.hide-narrow { display: none; } }
  @media (max-width: 699px) and (min-height: 601px) { .board { flex-direction: column; gap: 12px; } .big canvas { width: 72cqw; } .side { align-items: center; } .strip { flex-direction: row; } .strip i, .strip button { width: 36px; height: 36px; } }
  @media (max-height: 600px) { .strip { gap: 4px; padding: 4px; } .strip i, .strip button { width: 32px; height: 32px; } }
  @media (max-height: 600px) { .big canvas { width: 70cqh; } .patch canvas { width: 7cqh; } }

</style>
</head>
<body>
<!-- World, Tiles, first look: the grass tile drawn big, with the pencil's square under the finger, and the same tile
     beside it the way the game shows it, at real size and as a patch. The colours to paint with are beside the
     drawing; Pencil, Fill and Line are the paint tool's own settings, just above the toolbar. -->
<div class="canvas paper">
  <div class="fit">
    <div class="board">
      <div class="strip" title="The colours to paint with"><i style="background:#d9ef9b"></i><i style="background:#afd472" class="on"></i><i style="background:#88a45b"></i><i style="background:#607443"></i><i style="background:#d1aa83"></i><i style="background:#a07a52"></i><button title="Take a colour from the tile"><span class="ic" data-i="eyedropper"></span></button></div>
      <div class="big" data-pixel="grass" data-scale="1"><i class="cursor" style="left:37.5%;top:12.5%"></i></div>
      <div class="side">
        <span class="sub">In the game</span>
        <div class="patch"><span data-pixel="corner" data-scale="1"></span><span data-pixel="grass" data-scale="1"></span><span data-pixel="grass" data-scale="1"></span><span data-pixel="grass" data-scale="1"></span><span data-pixel="grass" data-scale="1"></span><span data-pixel="corner" data-scale="1" data-flip="1"></span><span data-pixel="earth" data-scale="1"></span><span data-pixel="earth" data-scale="1"></span><span data-pixel="earth" data-scale="1"></span><span data-pixel="earth" data-scale="1"></span><span data-pixel="earth" data-scale="1"></span><span data-pixel="earth" data-scale="1"></span></div>
        <span class="sub hide-narrow">Real size</span>
        <div class="patch real hide-narrow"><span data-pixel="corner" data-scale="1"></span><span data-pixel="grass" data-scale="1"></span><span data-pixel="grass" data-scale="1"></span><span data-pixel="grass" data-scale="1"></span><span data-pixel="grass" data-scale="1"></span><span data-pixel="corner" data-scale="1" data-flip="1"></span></div>
        
      </div>
    </div>
  </div>
</div>
