<!-- World, Levels, mid-project: the same level a few hours in. Three crates picked at once with the bar beside them,
     a button linked to a door, two zones, a problem (a crate in the ground), a teammate's pointer and a pinned note,
     and the Library pinned open. The extra crates, the door and the button are drawn for the mockup. -->
<div class="canvas">
  <div class="fit">
    <div class="stage grid">
      <img class="thing" src="art/crate.png" alt="" style="left:50%;top:73.8%">

      <div class="door"></div>
      <div class="press"></div>
      <svg class="links" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
        <path d="M73 81 C 76 60, 84 56, 89 64" fill="none" stroke="#eeb480" stroke-width="0.5" stroke-dasharray="1.4 1"/>
      </svg>
      <div class="zone" style="left:6.3%;top:56%;width:12.5%;height:27.4%"><span>Start</span></div>
      <div class="zone" style="left:6.3%;top:87%;width:87.4%;height:5%"><span>Fall out</span></div>

        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M2 2 L18 9 L10 11 L7 18 Z" fill="#b7b492" stroke="#111314" stroke-width="1.2"/></svg>
        <span>Mia</span>
      </div>
      <div class="pinned" style="left:66%;top:22%"><b>Mia · 10 min ago</b>Can the hero still jump over the door when it is open?</div>
    </div>
  </div>
</div>
