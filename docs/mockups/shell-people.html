<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shell · Who can change it (mockup)</title>
<link rel="stylesheet" href="mockup.css">
<link rel="stylesheet" href="shell.css">
</head>
<body>
<!-- Who can change Crate Game (the end-to-end actions check, H4), from the game's menu. Everyone on the team, each with what they may do in plain words: can look, can suggest, can check and put in, can change, or owner. An owner opens a person's level to change it (Jo's is open here, with what each one means, and the way to take Jo off the list). "Add someone" takes a GitHub name, and says they need GitHub only to sign in. The levels are kept in a file in the game's own folder, so an agent can read and change them the same way. -->

<div class="canvas">
  <div class="fit">
    <div class="stage grid">
      <div class="ring" style="left:37%;top:73.2%;width:7.2%;height:10.8%"></div>

    </div>
  </div>
</div>
<div class="dim" style="background:rgb(0 0 0 / 0.25)"></div><section class="pop share-pop" role="dialog" aria-label="Who can change Crate Game">
  <div class="hdr"><h3>Who can change Crate Game</h3><button class="sbtn"><span class="ic" data-i="x"></span>Close</button></div>
  <p>You are an owner, so you can change what anyone may do.</p>
  <div class="pp"><span class="face2 ">S</span><span class="who"><b>Sam (you)</b><small>Started the game</small></span><span class="lvl fixed">Owner</span></div>
  <div class="pp"><span class="face2 b">M</span><span class="who"><b>Mia</b><small>Joined last week</small></span><span class="lvl">Can check and put in<span class="ic" data-i="caret-down"></span></span></div>
  <div class="pp"><span class="face2 c">L</span><span class="who"><b>Lee</b><small>Joined last week</small></span><span class="lvl">Can change<span class="ic" data-i="caret-down"></span></span></div>
  <div class="pp"><span class="face2 d">J</span><span class="who"><b>Jo</b><small>Joined yesterday</small></span><span class="lvl">Can suggest<span class="ic" data-i="caret-down"></span></span></div>
  <div class="dropopen"><button class=""><span>Can look<small>Sees everything. Changes nothing.</small></span></button><button class="on"><span>Can suggest<small>Changes things, then sends them to be checked.</small></span><span class="ic" data-i="check"></span></button><button class=""><span>Can check and put in<small>Suggests, and checks other people's changes.</small></span></button><button class=""><span>Can change<small>Changes the game straight away.</small></span></button><hr><button class="out"><span>Take Jo off the list<small>Jo can no longer open Crate Game.</small></span><span class="ic" data-i="x"></span></button></div>
  <div class="addrow"><span class="tbox">Their GitHub name</span><button class="sbtn main"><span class="ic" data-i="plus"></span>Add</button></div>
  <p class="keep" style="margin-top:6px">They need GitHub only to sign in. Nothing else asks for it.</p>
</section>
<script src="base.js"></script>
<script>
window.MOCK = {
  ...BASE.levels, values: BASE.crate,
}
</script>
<script src="frame.js"></script>
</body>
</html>
