<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sound · Sounds, mid-project (mockup)</title>
<link rel="stylesheet" href="mockup.css">
<link rel="stylesheet" href="shell.css">
<style>
  .wavebox { position: absolute; inset: 10px 16px 12px; display: flex; flex-direction: column; gap: 6px; }
  .wave2 { position: relative; flex: 1; margin-top: 20px; display: flex; align-items: center; gap: 1px; border: 1px solid var(--edge); border-radius: 3px; padding: 0 2px; }
  .wave2 i { flex: 1; background: var(--quiet); border-radius: 1px; }
  .wave2 .cut { position: absolute; top: 0; bottom: 0; background: rgb(17 19 20 / 0.55); }
  .wave2 .trim { position: absolute; top: -4px; bottom: -4px; width: 0; border-left: 3px solid var(--accent); }
  .wave2 .trim::after { content: ""; position: absolute; top: 40%; left: -9px; width: 15px; height: 22px; border-radius: 3px; background: var(--accent); }
  .wave2 .fade { position: absolute; top: 0; bottom: 0; }
  .wave2 .fade svg { width: 100%; height: 100%; }
  .wave2 .wl { position: absolute; top: -21px; font: 500 13px var(--label); color: var(--words); }
  .takes { display: flex; gap: 6px; align-items: center; font-size: 14px; color: var(--quiet); }
  .takes .vpick { font-size: 14px; min-height: 34px; min-width: 34px; justify-content: center; padding: 0 6px; }
  .takes .vpick.on { border-color: var(--accent); color: var(--words); }
  .mixer { position: absolute; inset: 8px 12px; display: flex; gap: 10px; }
  .strip { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 6px; border: 1px solid var(--edge); border-radius: var(--corner); min-width: 0; }
  .strip.on { border-color: var(--accent); }
  .strip b { font: 600 14px var(--label); white-space: nowrap; }
  .meters { flex: 1; display: flex; gap: 10px; align-items: stretch; min-height: 0; }
  .meter { width: 4px; border-radius: 2px; background: var(--edge); position: relative; overflow: hidden; }
  .meter i { position: absolute; left: 0; right: 0; bottom: 0; background: var(--faint); }
  .fader { width: 6px; border-radius: 3px; background: var(--edge); position: relative; }
  .fader i { position: absolute; bottom: var(--v); left: -9px; width: 24px; height: 12px; border-radius: 3px; background: var(--words); border: 2px solid var(--ground); }
  .strip .num { font-size: 12px; color: var(--quiet); }
  .warncard { position: absolute; z-index: 4; right: 12px; top: 14%; width: min(280px, calc(100% - 24px)); display: grid; grid-template-columns: auto 1fr; gap: 6px 8px; align-items: center; padding: 10px 12px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); box-shadow: var(--shadow); font-size: 14px; }
  .warncard p { margin: 0; } .warncard .sbtn { grid-column: 1 / -1; justify-self: start; }
  .duck { position: absolute; right: 14px; top: 8px; }
  .mixer { overflow: hidden; } .strip { min-width: 0; } .mixer .more2 { display: none; justify-content: center; color: var(--quiet); font-size: 13px; text-align: center; }
  @media (max-width: 699px) and (min-height: 601px) { .mixer .strip:nth-child(n+4):not(.more2) { display: none; } .mixer .more2 { display: flex; } }
  /* A phone on its side: one row a group, a sliding fader across, so names never share a row with a knob. */
  @media (max-height: 600px) { .takes .label { display: none; }
    .mixer { flex-direction: column; gap: 2px; inset: 4px 12px; }
    .strip { flex: 1; flex-direction: row; padding: 0 8px; gap: 10px; min-height: 0; }
    .strip b { width: 88px; font-size: 13px; }
    .meters { flex-direction: column; justify-content: center; gap: 3px; align-self: stretch; }
    .meter { width: 100%; height: 3px; } .meter i { top: 0; right: auto; width: 60%; height: 100% !important; }
    .fader { width: 100%; height: 4px; } .fader i { bottom: auto; top: -6px; left: var(--v); width: 12px; height: 16px; }
    .strip .sbtn { height: 26px; font-size: 13px; } }
</style>
</head>
<body>
<!-- Sound, Sounds, mid-project: the mixer along the bottom while the level plays. One strip for each group of sounds,
     each with its meter and its slider, and the music picked: it gets quieter by itself when someone talks. A problem:
     the wind has no end and no fade, so it clicks when it starts again. -->
<div class="canvas">
  <div class="fit">
    <div class="stage grid">
      <span class="chip" style="left:6%;top:61%"><span class="ic" data-i="speaker-high"></span>Jump</span>
      <span class="chip" style="left:45%;top:79%"><span class="ic" data-i="speaker-high"></span>Push</span>
      <div class="warncard"><span class="ic" data-i="warning"></span><p>Wind clicks when it starts again</p><button class="sbtn">Smooth it out</button></div>
      <span class="chip" style="left:50%;top:4%;transform:translateX(-50%)"><span class="ic" data-i="music-notes"></span>Music: <span class="v">Meadow tune</span></span>
    </div>
  </div>
</div>
<script>
window.MOCK = {
  editor: 'sound', parts: [['Sounds', 'speaker-high'], ['Music', 'music-notes']], part: 0,
  tools: [['Pick', 'cursor', 'V'], ['Hand', 'hand', 'H'], ['Record', 'microphone', 'R'], ['Trim', 'scissors', 'T'], ['Play', 'play', 'P']],
  status: { pointer: '0.12', unit: 's', grid: false, snap: false },
  place: 'Level 1', off: [1, 2, 3], what: 'Level', saved: 'Not saved: 3 changes', changes: 3, tool: 4, zoom: '100%', state: 'mid-project',
  play: { paused: false, speed: 0, at: 55, time: '0:21' },
  list: { title: 'Sounds', count: 14, search: 'Find a sound', rows: [
      { head: 'Hero', count: 4 },
      { n: 'Jump', k: 'made', i: 'arrow-fat-up', on: false },
      { n: 'Land', k: 'made', i: 'arrow-down' },
      { n: 'Step', k: '3 takes', i: 'sneaker' },
      { n: 'Hurt', k: 'recorded', i: 'microphone' },
      { head: 'Crate', count: 2 },
      { n: 'Push', k: 'recorded', i: 'hand' },
      { n: 'Scrape', k: 'made', i: 'wave-sine' },
      { head: 'The level', count: 3 },
      { n: 'Door opens', k: 'made', i: 'door' },
      { n: 'Button', k: 'made', i: 'radio-button' },
      { n: 'Wind', k: 'loops', i: 'wind', warn: true },
    ],
    foot: '<button class="btn small"><span class="ic" data-i="plus"></span>New sound</button><button class="btn small"><span class="ic" data-i="upload-simple"></span>Bring in a recording</button>',
  },
  bottom: { title: 'How loud each group is', icon: 'sliders', html: `<div class="mixer"><div class="strip on"><b>Music</b><div class="meters"><span class="meter"><i style="height:62%"></i></span><span class="fader"><i style="--v:70%"></i></span></div><button class="sbtn">Only this</button></div><div class="strip"><b>Hero</b><div class="meters"><span class="meter"><i style="height:40%"></i></span><span class="fader"><i style="--v:85%"></i></span></div><button class="sbtn">Only this</button></div><div class="strip"><b>The level</b><div class="meters"><span class="meter"><i style="height:28%"></i></span><span class="fader"><i style="--v:60%"></i></span></div><button class="sbtn">Only this</button></div><div class="strip"><b>Talking</b><div class="meters"><span class="meter"><i style="height:0%"></i></span><span class="fader"><i style="--v:90%"></i></span></div><button class="sbtn">Only this</button></div><div class="strip"><b>Everything</b><div class="meters"><span class="meter"><i style="height:58%"></i></span><span class="fader"><i style="--v:80%"></i></span></div><button class="sbtn">Only this</button></div><div class="strip more2"><b>More</b><span>2 more groups ›</span></div></div>` },
  library: { open: false },
  closed: [['Changes', 'clock-counter-clockwise', 3], ['Problems', 'warning', 1]],
  values: {
    title: 'Music', sub: 'Music · how loud it is', pic: { i: 'music-notes' }, tab: 'Music',
    groups: [
      { name: 'Loudness', open: true, rows: [
        { t: 'slider', l: 'How loud', f: 'mix.music.volume', v: '70%', lo: 'Silent', hi: 'Full', at: 70, ch: true },
        { t: 'sw', l: 'Players may change it in Settings', f: 'mix.music.setting', on: true },
      ] },
      { name: 'Makes room for others', open: true, rows: [
        { t: 'sw', l: 'Gets quieter when someone talks', f: 'mix.music.duck', on: true, ch: true },
        { t: 'slider', l: 'How much quieter', f: 'mix.music.duckBy', v: 'half', lo: 'A little', hi: 'Almost silent', at: 50 },
      ] },
      { name: 'Echo and space', count: 2, rows: [] },
    ],
  },
}
</script>
<script src="frame.js"></script>
</body>
</html>
